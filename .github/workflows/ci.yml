name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -o addopts="" -q
      - name: JavaScript syntax
        run: for f in quantdesk/web/static/*.js quantdesk/web/static/app/*.js; do node --check "$f"; done
      - name: Workflow integrity
        run: python deploy/check_workflows.py
      - name: Dependency vulnerability audit
        continue-on-error: true   # a newly published CVE in a dependency warns; it doesn't fail unrelated changes
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r requirements.txt

  doctor:
    # Can GitHub's runners reach Yahoo and NSE right now? (informational; never fails the build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m quantdesk intraday doctor || true
