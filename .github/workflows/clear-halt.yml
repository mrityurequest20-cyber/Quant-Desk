# The owner clears one of the desk's entry halts from the Actions tab, on the record, with no shell:
#   inherited-position  quantdesk intraday clear-halt          (#41: an orphan, carried or expired leg; --force accepts it as is)
#   drawdown            quantdesk intraday clear-drawdown-halt (#62: the 10% cross-day drawdown halt; the high-water mark restarts)
# A halt is cleared between sessions: this refuses to run 08:00-16:15 IST Mon-Fri (the scheduler wakes the desk from 08:25,
# and a clear that restored before the desk but saved after it would fail the desk's own save), and waits until no desk
# and no learning cycle (live.yml, autolearn.yml, learn.yml: the other journal writers) is running. Only the repository
# owner may run it (job `if`); agents never dispatch it (docs/AUTONOMY.md). If the halt is not set it says so and saves nothing.
# Modelled on restate.yml: same permissions, same journal-admin group (never live-desk), the same compare-and-swap save.
name: Clear a desk halt

on:
  workflow_dispatch:
    inputs:
      halt:
        description: "Which halt to clear"
        type: choice
        required: true
        options:
          - inherited-position
          - drawdown
      reason:
        description: "Why it is safe to trade again (goes on the record)"
        required: true
      force:
        description: "inherited-position only: accept the position as it is now, although the mismatch is still there"
        type: boolean
        default: false

permissions:
  contents: write            # the journal and gh-pages branches
  actions: read              # see whether the live desk is running

concurrency:
  group: journal-admin
  cancel-in-progress: false

jobs:
  clear:
    if: github.actor == github.repository_owner      # the owner's action on the record, never a collaborator's or a bot's
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      HALT: ${{ inputs.halt }}
      REASON: ${{ inputs.reason }}
      FORCE: ${{ inputs.force }}
      PYTHONUNBUFFERED: "1"
      TZ: Asia/Kolkata
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Refuse inside the session window
        run: |
          now=$(TZ=Asia/Kolkata date '+%u %H%M'); dow=${now% *}; hm=$((10#${now#* }))
          if [ "$dow" -le 5 ] && [ "$hm" -ge 800 ] && [ "$hm" -le 1615 ]; then
            echo "::error::a halt is cleared between sessions, not 08:00-16:15 IST Mon-Fri (it is $(TZ=Asia/Kolkata date '+%a %H:%M') IST); nothing changed. Run it again after 16:15 IST or before 08:00."
            exit 1
          fi
      - name: Wait for a running desk to finish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 320); do
            busy=0
            for wf in live.yml autolearn.yml learn.yml; do             # every workflow that saves the journal
              n=$(gh run list -R "$GITHUB_REPOSITORY" --workflow "$wf" --limit 5 --json status \
                  --jq '[.[] | select(.status != "completed")] | length') || n=1   # can't tell: wait
              busy=$((busy + n))
            done
            [ "$busy" = "0" ] && exit 0
            [ "$i" = 1 ] && echo "the desk or a learning cycle is running; clearing the halt after it finishes"
            sleep 60
          done
          echo "::error::the live desk is still running after 5h20m"; exit 1
      - name: Refuse inside the session window (after the wait)
        run: |
          now=$(TZ=Asia/Kolkata date '+%u %H%M'); dow=${now% *}; hm=$((10#${now#* }))
          if [ "$dow" -le 5 ] && [ "$hm" -ge 800 ] && [ "$hm" -le 1615 ]; then
            echo "::error::a halt is cleared between sessions, not 08:00-16:15 IST Mon-Fri (it is $(TZ=Asia/Kolkata date '+%a %H:%M') IST); nothing changed. Run it again after 16:15 IST or before 08:00."
            exit 1
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore the journal
        run: deploy/journal.sh restore
      - name: Halt state before
        id: before
        run: |
          python - <<'PY'
          import json, os, sqlite3
          key = {"inherited-position": "intraday_halt", "drawdown": "intraday_drawdown_halt"}[os.environ["HALT"]]
          db = os.path.join(os.environ.get("QD_RUNTIME", "runtime"), "intraday", "journal.db")
          halt = None
          if os.path.exists(db):
              with sqlite3.connect(f"file:{db}?mode=ro", uri=True) as c:
                  row = c.execute("SELECT value FROM state WHERE key=?", (key,)).fetchone()
              halt = json.loads(row[0]) if row and row[0] else None
          if not halt:
              print(f"{os.environ['HALT']} halt: not set; nothing to clear")
          elif key == "intraday_halt":
              print(f"{os.environ['HALT']} halt: set at {halt.get('raised_at')}")
              for i in halt.get("items") or []:
                  print("  -", i.get("detail"))
          else:
              print(f"{os.environ['HALT']} halt: set", json.dumps(halt, default=str))
          with open(os.environ["GITHUB_OUTPUT"], "a") as o:
              o.write(f"present={'true' if halt else 'false'}\n")
          PY
      - name: Clear the halt
        if: steps.before.outputs.present == 'true'
        run: |
          case "$HALT" in
            inherited-position)
              args=(clear-halt --reason "$REASON" --by "$GITHUB_ACTOR")
              [ "$FORCE" = "true" ] && args+=(--force) ;;
            drawdown)
              [ "$FORCE" = "true" ] && echo "force only applies to inherited-position; ignored"
              args=(clear-drawdown-halt --reason "$REASON" --by "$GITHUB_ACTOR") ;;
            *) echo "::error::unknown halt '$HALT'"; exit 1 ;;
          esac
          python -m quantdesk intraday "${args[@]}"
      - name: Halt state after
        if: steps.before.outputs.present == 'true'
        run: |
          python - <<'PY'
          import json, os, sqlite3
          key = {"inherited-position": "intraday_halt", "drawdown": "intraday_drawdown_halt"}[os.environ["HALT"]]
          db = os.path.join(os.environ.get("QD_RUNTIME", "runtime"), "intraday", "journal.db")
          with sqlite3.connect(f"file:{db}?mode=ro", uri=True) as c:
              row = c.execute("SELECT value FROM state WHERE key=?", (key,)).fetchone()
          halt = json.loads(row[0]) if row and row[0] else None
          print(f"{os.environ['HALT']} halt after: {'STILL SET' if halt else 'cleared'}")
          raise SystemExit(1 if halt else 0)
          PY
      - name: Save the journal
        if: steps.before.outputs.present == 'true'
        run: deploy/journal.sh save "cleared the $HALT halt $(date '+%F %H:%M') IST"
      - name: Summary
        env:
          PRESENT: ${{ steps.before.outputs.present }}
        run: |
          {
            echo "### Clear a desk halt: $HALT"
            if [ "$PRESENT" = "true" ]; then
              echo "Cleared by $GITHUB_ACTOR (force: $FORCE). Reason: $REASON"
            else
              echo "Nothing to clear: that halt is not set. The journal was not changed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
