# Did every data channel deliver today, and is what arrived sane? (quantdesk/data/health.py, docs/DATA_HEALTH.md.) Read-only: it reads this
# repository's public releases and branches and the Actions API, writes nothing but the run summary, holds no secret and installs only the
# repository's own requirements. The run goes red when a CRITICAL channel (session bars, option chains, the NSE warehouse) is bad or missing,
# so a dead feed is a red run and an email, not a silent hole found a week later. Non-critical channels are shown in the summary only.
# Two firings: after the session's own files should exist (19:00 IST) and after the warehouse's evening update (22:15 IST). GitHub's cron can
# run hours late; the report is a function of the data and the clock at the time it runs, so a late run only reports later.
name: Data health

on:
  schedule:
    - cron: "30 13 * * 1-5"    # 19:00 IST
    - cron: "45 16 * * 1-5"    # 22:15 IST
  workflow_dispatch:
    inputs:
      day: {description: "IST date to check (YYYY-MM-DD); empty = today", required: false, type: string, default: ""}

permissions:
  contents: read
  actions: read              # the Kite recorder's artifacts are listed through the Actions API

defaults:
  run:
    shell: bash

concurrency:
  group: data-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: "1"
      TZ: Asia/Kolkata
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check every channel
        env:
          GITHUB_TOKEN: ${{ github.token }}      # only raises the API rate limit; the module never prints it
          DAY: ${{ inputs.day }}
        run: |
          if [ -n "$DAY" ]; then
            [[ "$DAY" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::bad day"; exit 1; }
            python -m quantdesk data health --summary --day "$DAY"
          else
            python -m quantdesk data health --summary
          fi
