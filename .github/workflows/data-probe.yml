# Fetch one sample of every NSE source the data warehouse reads and print the real formats
# (deploy/probe_nse.py). For writing and fixing parsers when NSE changes a file. Run it from the Actions tab.
name: NSE data probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python deploy/probe_nse.py
