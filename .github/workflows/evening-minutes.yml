# MCX and currency minutes from Kotak's candle history (quantdesk/data/evening_minutes.py): MANUAL ONLY, NOT SCHEDULED.
#
# Its first run (7 Nov 2026, days = 30) asked Kotak for the near-month future of all 31 MCX commodities and 7 currency pairs the scrip master lists and got, for every one:
# "HTTP 422: Historical data is not supported for this exchange". Kotak's candle API serves NSE and BSE only, so this route cannot record the MCX or currency evenings. It stays as a
# manual tool (the scrip master and chain endpoints do work for both segments, which the manifest of that run records), and the nightly cron was removed so it does not fail every night.
# The MCX and currency evenings need Kite (its historical candles, or its ticks past 15:32): see docs/PIPELINE_READINESS.md.
#
# Market data only, through the Kotak consumer key the other recorders use (the one secret here, in the one step that needs it). It places no order and touches no journal, no desk, no limit.
name: Evening minutes

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Days back (Kotak serves about 30); 30 backfills the history"
        default: "3"

permissions:
  contents: write            # the evening-minutes-YYYY release assets (and nothing else)

concurrency:
  group: evening-minutes     # its own group: never queues behind, or holds up, the session recorder or the Kite recorder
  cancel-in-progress: false

jobs:
  evening:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
      TZ: Asia/Kolkata
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect the day's MCX and currency minutes (Kotak candles; a problem is a warning, never a failed run)
        env:
          KOTAK_CONSUMER_KEY: ${{ secrets.KOTAK_CONSUMER_KEY }}
          GH_TOKEN: ${{ github.token }}
          DAYS: ${{ inputs.days || '3' }}
        run: |
          [[ "$DAYS" =~ ^[0-9]{1,2}$ ]] || { echo "::error::days must be a number"; exit 1; }
          python -m quantdesk data evening-minutes --days "$DAYS" --release-prefix evening-minutes || echo "::warning::evening minutes failed"
