# The Fyers feed (docs/FEEDS.md): MCX commodities and currency pairs, every five seconds, to the private live relay as feed "f". The owner's split of 13 Nov 2026: Kite carries indices,
# stocks and options; Fyers carries MCX (and is currency's second feed); Kotak stands behind them all. Market data only: the code calls /data/quotes and /data/depth and nothing else
# (a test checks), and writes no price to disk, to the repository or to a release.
#
# Login (docs/AUTONOMY.md, "More market-data brokers"): the `token` job logs in by itself with the owner's Fyers secrets: the stored refresh token and the PIN on most days, the full TOTP
# login when that is refused (deploy/fyers_autologin.py). The PIN, TOTP key and client id reach that one step only, which runs standard-library Python (`-I -S`). Lockout guard: only the
# first run of the IST day, on its first attempt, may log in (deploy/kite_login_gate.py with GATE_WORKFLOW), and a run that finds today's token already stored never logs in again. The
# tokens are kept encrypted with the app secret on the `fyers-token` branch (deploy/fyers-token.sh); that job alone may write to the repository.
#
# Three feed jobs because a hosted job may run at most six hours and MCX trades to 23:30 (23:55 when the US is off daylight saving): 09:00 to 14:15, to 20:05, to 23:58. Each loads
# today's token from the branch; none holds the PIN or the TOTP key, and none may write.
name: Fyers feed

on:
  workflow_dispatch:            # started once a day by deploy/scheduler.py; no cron of its own, so it never starts twice
    inputs:
      first_until:
        description: "First feed job streams until (HH:MM IST)"
        default: "14:15"
        type: string
      second_until:
        description: "Second feed job streams until (HH:MM IST)"
        default: "20:05"
        type: string
      third_until:
        description: "Third feed job streams until (HH:MM IST)"
        default: "23:58"
        type: string
      check_only:
        description: "Only check the login and the data: one round, nothing sent to the relay (run it before the first session)"
        default: false
        type: boolean

permissions:
  contents: read

defaults:
  run:
    shell: bash              # bash -e -o pipefail

concurrency:
  group: fyers-feed
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  TZ: Asia/Kolkata

jobs:
  token:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write        # the fyers-token branch: one encrypted file
      actions: read          # the login gate lists this workflow's runs
    outputs:
      ok: ${{ steps.done.outputs.ok }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check the inputs (before the day's only login is spent)
        env:
          A: ${{ inputs.first_until || '14:15' }}
          B: ${{ inputs.second_until || '20:05' }}
          C: ${{ inputs.third_until || '23:58' }}
        run: |
          for t in "$A" "$B" "$C"; do [[ "$t" =~ ^([01][0-9]|2[0-3]):[0-5][0-9]$ ]] || { echo "::error::times must be HH:MM"; exit 1; }; done
      - name: The stored token (a run that finds today's never logs in again)
        id: stored
        env:
          FYERS_SECRET_ID: ${{ secrets.FYERS_SECRET_ID }}
        run: deploy/fyers-token.sh load
      - name: May this run log in? (only the first run of the day, first attempt)
        id: gate
        if: steps.stored.outputs.today != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_WORKFLOW: fyers-feed.yml
        run: /usr/bin/python3 -I -S deploy/kite_login_gate.py
      - name: Log in to Fyers by itself (data only; the PIN and TOTP key reach this step alone)
        id: login
        if: steps.stored.outputs.today != 'true' && steps.gate.outputs.first == 'true' && github.run_attempt == '1'
        env:
          FYERS_APP_ID: ${{ secrets.FYERS_APP_ID }}
          FYERS_SECRET_ID: ${{ secrets.FYERS_SECRET_ID }}
          FYERS_REDIRECT_URI: ${{ secrets.FYERS_REDIRECT_URI }}
          FYERS_CLIENT_ID: ${{ secrets.FYERS_CLIENT_ID }}
          FYERS_PIN: ${{ secrets.FYERS_PIN }}
          FYERS_TOTP_SECRET: ${{ secrets.FYERS_TOTP_SECRET }}
        run: /usr/bin/python3 -I -S deploy/fyers_autologin.py --refresh-in "$RUNNER_TEMP/fyers_refresh" --out "$RUNNER_TEMP/fyers_login.json"
      - name: Store it, encrypted, on the fyers-token branch
        id: store
        if: steps.login.outcome == 'success'
        env:
          FYERS_SECRET_ID: ${{ secrets.FYERS_SECRET_ID }}
          GH_TOKEN: ${{ github.token }}
        run: deploy/fyers-token.sh store
      - name: Is there a token for the feed?
        id: done
        if: always()
        env:
          TODAY: ${{ steps.stored.outputs.today }}
          STORED: ${{ steps.store.outputs.stored }}
        run: |
          ok=false
          if [ "$TODAY" = "true" ] || [ "$STORED" = "true" ]; then ok=true; fi
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          echo "Fyers token for today: $ok"

  check:
    needs: token
    if: inputs.check_only && needs.token.outputs.ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Today's Fyers token
        env:
          FYERS_SECRET_ID: ${{ secrets.FYERS_SECRET_ID }}
        run: deploy/fyers-token.sh export
      - name: One round against Fyers, nothing sent anywhere
        env:
          FYERS_APP_ID: ${{ secrets.FYERS_APP_ID }}
        run: python -m quantdesk data fyers-feed --check --metrics fyers_check.json
      - name: The check's counts (no price, no token)
        if: always()
        run: if [ -f fyers_check.json ]; then { echo "## Fyers login and data check"; echo '```'; cat fyers_check.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi

  feed-1:
    needs: token
    if: "!inputs.check_only && needs.token.outputs.ok == 'true'"
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Today's Fyers token
        env:
          FYERS_SECRET_ID: ${{ secrets.FYERS_SECRET_ID }}
        run: deploy/fyers-token.sh export
      - name: Stream MCX and currency to the live relay
        env:
          UNTIL: ${{ inputs.first_until || '14:15' }}
          FYERS_APP_ID: ${{ secrets.FYERS_APP_ID }}
          LIVE_URL: ${{ vars.LIVE_URL }}
          LIVE_INGEST_TOKEN: ${{ secrets.LIVE_INGEST_TOKEN }}
        run: |
          cap=$(date -d '+340 minutes' +%H:%M)     # an early start must still stop before the job's 358-minute limit
          if [[ "$cap" < "$UNTIL" ]] && [[ "$cap" > "$(date +%H:%M)" ]]; then UNTIL=$cap; fi       # (a cap past midnight wraps to the small hours: then the until stands)
          python -m quantdesk data fyers-feed --until "$UNTIL" --metrics fyers_metrics.json
      - name: The run's counts (no price, no token)
        if: always()
        run: if [ -f fyers_metrics.json ]; then { echo '```'; cat fyers_metrics.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi

  feed-2:
    needs: [token, feed-1]
    if: always() && !inputs.check_only && needs.token.outputs.ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Today's Fyers token
        env:
          FYERS_SECRET_ID: ${{ secrets.FYERS_SECRET_ID }}
        run: deploy/fyers-token.sh export
      - name: Stream MCX and currency to the live relay
        env:
          UNTIL: ${{ inputs.second_until || '20:05' }}
          FYERS_APP_ID: ${{ secrets.FYERS_APP_ID }}
          LIVE_URL: ${{ vars.LIVE_URL }}
          LIVE_INGEST_TOKEN: ${{ secrets.LIVE_INGEST_TOKEN }}
        run: |
          cap=$(date -d '+340 minutes' +%H:%M)
          if [[ "$cap" < "$UNTIL" ]] && [[ "$cap" > "$(date +%H:%M)" ]]; then UNTIL=$cap; fi
          python -m quantdesk data fyers-feed --until "$UNTIL" --metrics fyers_metrics.json
      - name: The run's counts (no price, no token)
        if: always()
        run: if [ -f fyers_metrics.json ]; then { echo '```'; cat fyers_metrics.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi

  feed-3:
    needs: [token, feed-2]
    if: always() && !inputs.check_only && needs.token.outputs.ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Today's Fyers token
        env:
          FYERS_SECRET_ID: ${{ secrets.FYERS_SECRET_ID }}
        run: deploy/fyers-token.sh export
      - name: Stream MCX to the live relay until the evening close
        env:
          UNTIL: ${{ inputs.third_until || '23:58' }}
          FYERS_APP_ID: ${{ secrets.FYERS_APP_ID }}
          LIVE_URL: ${{ vars.LIVE_URL }}
          LIVE_INGEST_TOKEN: ${{ secrets.LIVE_INGEST_TOKEN }}
        run: |
          cap=$(date -d '+290 minutes' +%H:%M)
          if [[ "$cap" < "$UNTIL" ]] && [[ "$cap" > "$(date +%H:%M)" ]]; then UNTIL=$cap; fi       # (a cap past midnight wraps to the small hours: then the until stands)
          python -m quantdesk data fyers-feed --until "$UNTIL" --metrics fyers_metrics.json
      - name: The run's counts (no price, no token)
        if: always()
        run: if [ -f fyers_metrics.json ]; then { echo '```'; cat fyers_metrics.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
