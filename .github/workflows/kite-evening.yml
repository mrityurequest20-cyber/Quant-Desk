# MCX and currency evening candles from Kite's historical API (quantdesk/data/kite_evening.py), after their sessions: MCX trades to 23:30 (23:55 some months), currency to 17:00, and the
# Kite tick recorder stops at 15:32. Kotak cannot fill the evening (its candle API answers HTTP 422 for both segments), so this reads the last days' 1-minute candles (with open interest)
# of the nearest two futures of every MCX commodity and currency pair, and, on request, their daily history. A late or missed run heals itself: each run re-reads the last `days` days.
#
# A SEPARATE workflow from the Kite tick recorder (kite-record.yml, the pre-registered trial): its own concurrency group, nothing shared but the owner's secrets. Market data only: no
# order, position, holding, margin or profile method is called anywhere in this code (a test checks).
#
# Login: a third automatic Kite login of the day, so it is held to a stricter rule than the recorder's (deploy/kite_evening_gate.py): first attempt only, the earliest run of this
# workflow for the session day, and only if that day's kite-record.yml run succeeded with its automatic login step succeeded (the credentials are proven good that day). The password,
# user ID and TOTP key reach the one login step only (standard-library Python, `-I -S`), never the step that holds the API secret. No proven login = this run collects nothing.
#
# Licence: Kite's candles are licensed to the subscriber and this repository is public, so they are AES-256 encrypted with the owner's API secret (deploy/kite-decrypt.sh) and kept as a 90-day
# artifact only. The second job, which holds the write permission and none of the Kite secrets, publishes the run's manifest (counts and statuses, never a price) to the
# evening-minutes-YYYY release, where the data-health check reads it.
name: Kite evening candles

on:
  schedule:
    - cron: "35 18 * * 1-5"       # 00:05 IST Tue to Sat: the evening of Mon to Fri has ended (best-effort; a late run is fine)
  workflow_dispatch:
    inputs:
      days:
        description: "Days of 1-minute candles (Kite keeps about 60); 55 backfills"
        default: "3"
      daily_days:
        description: "Also the continuous daily history this many days back (up to 1900); 0 = none"
        default: "0"

permissions:
  contents: read
  actions: read                  # the login gate lists this workflow's and the recorder's runs

defaults:
  run:
    shell: bash

concurrency:
  group: kite-evening            # its own group: never queues behind, or holds up, the session recorder or the Kite tick recorder
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  TZ: Asia/Kolkata

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      day: ${{ steps.find.outputs.day }}
    env:
      KITE_DATA_KEY: ${{ secrets.KITE_API_KEY }}          # the API key only (not the secret); this job alone holds it, the publish job does not
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-kite.txt
      - name: Check the inputs (before the day's only evening login is spent)
        env:
          DAYS: ${{ inputs.days || '3' }}
          DAILY_DAYS: ${{ inputs.daily_days || '0' }}
        run: '[[ "$DAYS" =~ ^[0-9]{1,2}$ && "$DAILY_DAYS" =~ ^[0-9]{1,4}$ ]] || { echo "::error::days must be numbers"; exit 1; }'
      - name: May this run log in? (the credentials must be proven today, and this is the day's only evening login)
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: /usr/bin/python3 -I -S deploy/kite_evening_gate.py
      - name: Log in to Kite by itself (data only; the password reaches this step alone)
        id: login
        if: steps.gate.outputs.first == 'true' && github.run_attempt == '1'
        continue-on-error: true
        env:
          KITE_USER_ID: ${{ secrets.KITE_USER_ID }}
          KITE_PASSWORD: ${{ secrets.KITE_PASSWORD }}
          KITE_TOTP_SECRET: ${{ secrets.KITE_TOTP_SECRET }}
        run: deploy/kite-autologin.sh login
      - name: Exchange it for today's access token
        id: exchange
        if: steps.login.outcome == 'success'
        continue-on-error: true
        env:
          KITE_DATA_SECRET: ${{ secrets.KITE_API_SECRET }}
        run: deploy/kite-autologin.sh exchange
      - name: Collect the evening candles (a Kite problem is a warning, never a red run)
        id: run
        env:
          DAYS: ${{ inputs.days || '3' }}
          DAILY_DAYS: ${{ inputs.daily_days || '0' }}
        run: python -m quantdesk data kite-evening --out runtime/kite_evening --days "$DAYS" --daily-days "$DAILY_DAYS"
      - name: Find the run folder (even if the collection stopped half way, what it wrote is still encrypted and kept)
        id: find
        if: always()
        run: |
          d=$(ls -1 runtime/kite_evening 2>/dev/null | sort | tail -1 || true)
          [[ "$d" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || d=""
          echo "day=$d" >> "$GITHUB_OUTPUT"
      - name: Encrypt the candles with the owner's API secret
        id: enc
        if: always() && steps.find.outputs.day != ''
        env:
          KITE_DATA_SECRET: ${{ secrets.KITE_API_SECRET }}
          DAY: ${{ steps.find.outputs.day }}
        run: |
          d="runtime/kite_evening/$DAY/data"
          if [ -d "$d" ] && [ -n "$(ls -A "$d")" ]; then
            [ -n "$KITE_DATA_SECRET" ] || { echo "::error::KITE_API_SECRET is empty: the candles are not encrypted and not uploaded"; exit 1; }
            tar -C "$d" -cf - . | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:KITE_DATA_SECRET -out kite_evening_data.tar.enc
            echo "kite_evening_data.tar.enc sha256 $(sha256sum kite_evening_data.tar.enc | cut -d' ' -f1)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Keep the encrypted candles
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kite-evening-data
          path: kite_evening_data.tar.enc
          if-no-files-found: ignore
          retention-days: 90
      - name: Keep the manifest (counts and statuses only)
        if: always() && steps.find.outputs.day != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kite-evening-manifest
          path: runtime/kite_evening/${{ steps.find.outputs.day }}/manifest.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Report a failed automatic login (so the watchdog sees it)
        if: always() && (steps.login.outcome == 'failure' || steps.exchange.outcome == 'failure')
        run: |
          echo "::error::the evening Kite login failed (see the login step); nothing was collected"
          exit 1

  publish:
    needs: collect
    if: ${{ always() && needs.collect.outputs.day != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write            # the evening-minutes-YYYY release assets (the manifest) and nothing else; this job holds no Kite secret
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: The day is a plain date (checked before it is used as a path)
        env:
          DAY: ${{ needs.collect.outputs.day }}
        run: '[[ "$DAY" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::bad day"; exit 1; }'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: kite-evening-manifest
          path: runtime/kite_evening/${{ needs.collect.outputs.day }}
      - name: Publish the manifest (it is checked to carry no price before it goes)
        env:
          GH_TOKEN: ${{ github.token }}
          DAY: ${{ needs.collect.outputs.day }}
        run: |
          [[ "$DAY" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::bad day"; exit 1; }
          python -m quantdesk data evening-publish --dir "runtime/kite_evening/$DAY" --release-prefix evening-minutes
