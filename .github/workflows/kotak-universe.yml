# What the relay's Kotak poller fetches (docs/LIVE.md, quantdesk/data/kotak_universe.py): every F&O stock and its future, the index spots and the index option chains, listed from
# Kotak's own scrip master and chain endpoints and pushed to the relay. Market data only: the Kotak consumer key reads two lists and two read endpoints; no order endpoint is
# called anywhere. Twice each weekday morning (GitHub's cron can run hours late) and on demand; the relay ALSO dispatches this workflow itself from its own 10-minute cron when its
# universe is not today's, and keeps yesterday's universe if a build fails, so a late or missed run costs a little freshness, not the feed.
name: Kotak universe

on:
  schedule:
    - cron: "30 2 * * 1-5"     # 08:00 IST
    - cron: "30 3 * * 1-5"     # 09:00 IST
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: kotak-universe
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: "1"
      TZ: Asia/Kolkata
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build the universe and push it to the relay (counts only are printed)
        env:
          KOTAK_CONSUMER_KEY: ${{ secrets.KOTAK_CONSUMER_KEY }}
          LIVE_URL: ${{ vars.LIVE_URL }}
          LIVE_INGEST_TOKEN: ${{ secrets.LIVE_INGEST_TOKEN }}
        run: python -m quantdesk data kotak-universe --push
