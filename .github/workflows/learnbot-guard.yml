# The Learnbot guard (docs/LEARNBOT.md): a pull request from a learnbot/ branch may only add a new pre-registered spec, a
# dated report or a learning note. Any other branch passes at once, so this can be a required check on main.
#
# Properties that matter more than the rest:
# - It runs the guard from the BASE branch's code and reads the pull request only as git objects (a fetched ref, never
#   checked out or executed), so a pull request cannot weaken or skip the check that judges it.
# - It judges the exact head the event named; if the pull request moved since, this run fails as stale and the newer run
#   judges the new head.
# - It fails closed: if the guard is missing from the base branch the check is red, except for a pull request (never a
#   learnbot/ one) that itself adds the guard (the bootstrap).
# - It holds contents: read and nothing else, uses no secret, and installs nothing (the guard is standard library only).
#   The checkout keeps its read-only token so the pull request's ref can be fetched from a private repository.
name: Learnbot guard

on:
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    name: Learnbot guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - name: Judge the pull request
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr/head"
          if [ "$(git rev-parse refs/remotes/pr/head)" != "$HEAD_SHA" ]; then
            echo "Stale run: the pull request moved after this run started. The newer run judges the new head." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ ! -f quantdesk/learnbot/guard.py ]; then
            case "${HEAD_REF,,}" in
              learnbot/*) echo "A learnbot/ pull request needs the guard on the base branch: refusing to pass." | tee -a "$GITHUB_STEP_SUMMARY"; exit 1 ;;
            esac
            if git cat-file -e "$HEAD_SHA:quantdesk/learnbot/guard.py" 2>/dev/null; then
              echo "Bootstrap: this pull request adds the guard; there is nothing on the base branch to judge it with." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "The guard is missing from the base branch: refusing to pass." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          python3 -m quantdesk.learnbot.guard --base "$BASE_SHA" --head "$HEAD_SHA" --branch "$HEAD_REF" | tee -a "$GITHUB_STEP_SUMMARY"
