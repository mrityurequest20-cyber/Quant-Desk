# The live paper desk, unattended, every NSE trading day.
#
# GitHub runs this on its own machines (free and unlimited for public repos). A hosted job may
# run at most 6 hours and the session is 6h15m (09:15–15:30 IST), so the day is split across two
# jobs: `morning` trades until the hand-over time and leaves its open positions in place;
# `afternoon` restores the journal and carries on to the close, squares off, writes the review.
#
# State lives on the `journal` branch; the read-only site is re-published to the `gh-pages`
# branch every few minutes (turn on Settings → Pages → Deploy from a branch → gh-pages).
# Kill switch: cancel the run in the Actions tab; open positions are squared off at once.
name: Live paper desk

on:
  schedule:
    # 08:52 IST Mon–Fri. Scheduled runs often start a few minutes late; the engine waits for
    # 09:15 either way, and on NSE holidays it exits within a minute.
    - cron: "22 3 * * 1-5"
  workflow_dispatch:
    inputs:
      handover:
        description: "Morning runner hands over to the afternoon one at (HH:MM IST)"
        default: "12:20"
      reset_account:
        description: "Archive the paper account and start fresh at the configured capital"
        type: boolean
        default: false
      resume_after_cancel:
        description: "Trade again today although a desk run was cancelled today (the kill switch); off = stay stopped"
        type: boolean
        default: false

permissions:
  contents: write            # push the journal and gh-pages branches

concurrency:
  group: live-desk           # never two desks on one journal
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  TZ: Asia/Kolkata
  HANDOVER: ${{ inputs.handover || '12:20' }}
  PUBLISH_EVERY_MIN: "6"     # Pages allows ~10 builds an hour
  # Kotak Neo data (live option bid/ask, chain, 1m bars): consumer key only — no login, no orders, no static IP.
  # Unset: the desk uses Yahoo bars and NSE's public chain, as before.
  KOTAK_CONSUMER_KEY: ${{ secrets.KOTAK_CONSUMER_KEY }}
  # Language models as second news readers and the after-close reflection (intraday/llm.py). Each is used only when
  # its key is set; several secret names are accepted for each.
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || secrets.CLAUDE_API_KEY || secrets.CLAUDE_KEY || secrets.CLAUDE_API || secrets.CLOUD_API_KEY || secrets.CLOUD_API || secrets.CLAUDE_API_TOKEN || secrets.ANTHROPIC_API || secrets.ANTHROPIC_KEY || secrets.ANTHROPIC || secrets.CLAUDE || secrets.CLOUDE_API || secrets.CLOUDE_API_KEY || secrets.CLAUDE_AI_API_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY || secrets.GOOGLE_API || secrets.GOOGLE_AI_API_KEY || secrets.GOOGLE_GENAI_API_KEY || secrets.GEMINI_KEY || secrets.GEMINI_API || secrets.GEMINI || secrets.GOOGLE_KEY || secrets.GOOGLE || secrets.GOOGLEAPI || secrets.GOOGLE_API_TOKEN || secrets.GOOGLE_GEMINI_API_KEY || secrets.GOOGLE_AI_KEY || secrets.GOOGLE_AI_STUDIO_KEY }}
  OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY || secrets.OLLAMA_KEY || secrets.OLAMA_API_KEY || secrets.OLLAMA_API || secrets.OLLAMA_TOKEN || secrets.OLLAMA || secrets.OLAMA_API || secrets.OLAMA }}

jobs:
  # S0-09: GitHub's own cron is late on this repo (08:52 IST arrived 15:19-16:13 IST) and, queued behind the day's
  # session in the live-desk group, re-ran the whole pipeline after the close every day (sleeves and journal save
  # twice). The Cloudflare alarm dispatches the real session; a scheduled run that starts after 15:00 IST is a no-op.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read              # C-08 (owner-approved 16 Oct): read today's runs of this workflow; no write rights
    outputs:
      go: ${{ steps.when.outputs.go }}
    steps:
      - id: when
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME: ${{ inputs.resume_after_cancel && '1' || '' }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date +%H%M)" -ge 1500 ]; then
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "::notice::scheduled run started at $(date '+%H:%M') IST, after the session: nothing to do"
            exit 0
          fi
          # C-08: cancelling a trading run is the kill switch. A run queued behind it (the 08:52 schedule, a dispatch)
          # must not start the desk again the same day. Only a run whose "Trade (paper)" step was itself cancelled
          # counts: GitHub also cancels a run that was merely pending when another queued in the group, and that is
          # no kill switch. Fail closed: if today's runs can't be read, don't trade.
          if [ "$RESUME" != "1" ]; then
            killed=0
            if ! ids=$(gh run list -R "$GITHUB_REPOSITORY" --workflow live.yml --created "$(date +%F)" --limit 50 \
                         --json databaseId,conclusion --jq '.[] | select(.conclusion == "cancelled") | .databaseId'); then
              killed=unknown
            fi
            for id in $ids; do
              if ! n=$(gh run view "$id" -R "$GITHUB_REPOSITORY" --json jobs --jq \
                         '[.jobs[].steps[]? | select((.name | startswith("Trade (paper)")) and .conclusion == "cancelled")] | length'); then
                killed=unknown; break
              fi
              [ "$n" != "0" ] && killed=$((killed + 1))
            done
            if [ "$killed" = "unknown" ]; then
              echo "go=false" >> "$GITHUB_OUTPUT"
              echo "::error::could not read today's desk runs to check for a kill switch: not trading (dispatch with resume_after_cancel to override)"
              exit 0
            fi
            if [ "$killed" != "0" ]; then
              echo "go=false" >> "$GITHUB_OUTPUT"
              echo "::warning::a trading run was cancelled today (kill switch): staying stopped. Dispatch with resume_after_cancel to trade again."
              exit 0
            fi
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"

  morning:
    needs: gate
    if: ${{ needs.gate.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    outputs:   # C-01: once the morning has traded, the afternoon resumes only from the morning's own save
      started: ${{ steps.started.outputs.started }}
      saved: ${{ steps.save.outputs.saved }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Can this runner see the market?
        run: python -m quantdesk intraday doctor || echo "::warning::doctor says the data feed is down; the engine will retry every minute"
      - name: Restore the journal
        id: restore
        run: deploy/journal.sh restore
      - name: Fetch the latest edge research (priors that survived out-of-sample testing)
        run: deploy/research.sh
      - name: Fetch context from the data warehouse (heavyweights' results, a year of bhavcopy for the IV percentile)
        env:
          GH_TOKEN: ${{ github.token }}
        run: deploy/warehouse-context.sh
      - name: Seed the learning record if it's empty (replays the last week's real sessions; factors and news only)
        run: python -m quantdesk intraday learn --bootstrap --if-empty || echo "::warning::learning bootstrap skipped"
      - name: Start a fresh paper account
        if: ${{ inputs.reset_account }}
        run: python -m quantdesk intraday reset-account --yes
      - name: From here on the journal holds today's session
        id: started
        run: echo "started=true" >> "$GITHUB_OUTPUT"
      - name: Trade (paper) until the hand-over
        run: deploy/run-session.sh --quiet --until "$HANDOVER" --handover
      - name: Kill switch — square off
        if: cancelled()
        run: python -m quantdesk intraday live --close-out && python -m quantdesk intraday export-site --dir _site --sessions 2 && deploy/push-dir.sh _site gh-pages "site (stopped)"
      - name: Save the journal
        id: save
        if: ${{ always() && steps.restore.outcome == 'success' }}   # C-01: never push over the only copy after a failed restore
        env:
          JOURNAL_ALLOW_SHRINK: ${{ inputs.reset_account && '1' || '' }}   # a deliberate reset archives the old record
        run: deploy/journal.sh save "morning $(date '+%F %H:%M') IST" && echo "saved=true" >> "$GITHUB_OUTPUT"
      # the morning's option-chain snapshots live only on this runner: keep them, or a morning trade's
      # fills can never be checked against the real quotes (29 Sep 2026: they were lost)
      - name: Keep the morning's raw data (bars + option-chain snapshots) for replays
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: session-data-morning-${{ github.run_id }}
          path: runtime/intraday/data
          retention-days: 90
          if-no-files-found: ignore
      - name: Keep them for good too (Parquet on the chains-YYYY release; artifacts expire after 90 days)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m quantdesk data archive-session --part "morning-${{ github.run_id }}" --day "$(date +%F)" || echo "::warning::session archive failed; the artifact still has the data"

  afternoon:
    needs: morning
    if: ${{ !cancelled() && needs.morning.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.ref }}   # the branch tip, not the morning's commit: fixes pushed before the hand-over apply
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore the journal
        id: restore
        run: deploy/journal.sh restore
      # C-01: if the morning's save didn't land, the journal just restored is last night's. Trading on it would forget
      # the morning's trades, cash and daily-loss baseline, and the close save would then replace the record for good.
      - name: Stand down unless the morning's save is what was restored
        id: standdown
        if: ${{ needs.morning.outputs.started == 'true' && needs.morning.outputs.saved != 'true' }}
        run: |
          echo "::error::the morning's journal save did not complete: the afternoon would resume from last night's state; standing down (nothing is saved over the record)"
          exit 1
      - name: Fetch the latest edge research
        run: deploy/research.sh
      - name: Fetch context from the data warehouse (heavyweights' results, a year of bhavcopy for the IV percentile)
        env:
          GH_TOKEN: ${{ github.token }}
        run: deploy/warehouse-context.sh
      - name: Trade (paper) to the close, square off, write the review
        id: trade
        run: deploy/run-session.sh --quiet
      - name: Kill switch — square off
        if: cancelled()
        run: python -m quantdesk intraday live --close-out && python -m quantdesk intraday export-site --dir _site --sessions 2 && deploy/push-dir.sh _site gh-pages "site (stopped)"
      # C-03: the engine died (crash, OOM, a hang past the timeout) with nothing left to manage its positions: square
      # them off now rather than carry them overnight. Idempotent: "nothing open" when the session closed normally.
      - name: Square off after a failed session
        if: ${{ failure() && steps.restore.outcome == 'success' && steps.trade.outcome == 'failure' }}
        run: python -m quantdesk intraday live --close-out
      # the pre-registered expiry sellers (docs/prereg/expiry_seller_v1.json): paper only, from the tape's real 15:20
      # quotes on an expiry's eve, settled at the expiry-day close; before the journal is saved, so the ledger is kept
      - name: Expiry sellers (paper sleeves)
        if: always()
        timeout-minutes: 15          # NSE's archive can hang; the journal save below is `if: always()` and still runs
        run: python -m quantdesk intraday sleeves | tee -a "$GITHUB_STEP_SUMMARY" || echo "::warning::expiry sleeves failed"
      - name: Progress snapshot (is the desk getting smarter? ops/progress.py)
        if: always()
        run: python -m quantdesk intraday progress > /dev/null || echo "::warning::progress snapshot failed"
      - name: Save the journal
        if: ${{ always() && steps.restore.outcome == 'success' && steps.standdown.outcome != 'failure' }}   # C-01
        run: deploy/journal.sh save "close $(date '+%F %H:%M') IST"
      - name: Today's review
        if: always()
        run: |
          python -m quantdesk intraday review >> "$GITHUB_STEP_SUMMARY" || true
          python -m quantdesk intraday trades --date "$(date +%F)" || true
      - name: Keep the day's raw data (bars + option-chain snapshots) for replays
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: session-data-${{ github.run_id }}
          path: runtime/intraday/data
          retention-days: 90
          if-no-files-found: ignore
      - name: Keep them for good too (Parquet on the chains-YYYY release)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m quantdesk data archive-session --part "afternoon-${{ github.run_id }}" --day "$(date +%F)" || echo "::warning::session archive failed; the artifact still has the data"
      - name: Keep the session's option minutes (Kotak 1-minute candles; Kotak forgets them after ~30 days)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m quantdesk data kotak-backfill --days 3 --release-prefix option-minutes || echo "::warning::option-minute backfill failed"
