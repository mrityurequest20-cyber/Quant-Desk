        if: ${{ always() }}
        env:
          HANDOVER_KEY: ${{ secrets.PAPER_HANDOVER_KEY || secrets.MARKET_TAPE_KEY }}
        run: |
          if [ ! -f runtime/paper/ledger/account.json ]; then echo "no account file to hand over"; exit 0; fi
          if [ -f runtime/paper/picked.stamp ] && [ ! runtime/paper/ledger/account.json -nt runtime/paper/picked.stamp ]; then
            echo "::warning::this part did not start from its copy (see the runner's step), so that copy is not handed over again"; exit 0
          fi
          if [ "${#HANDOVER_KEY}" -lt 32 ]; then echo "::warning::no hand-over key (PAPER_HANDOVER_KEY, or MARKET_TAPE_KEY, of 32+ characters): the next part starts from the relay's copy only; add the secret (openssl rand -base64 32)"; exit 0; fi
          mkdir -p handover-out
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:HANDOVER_KEY -in runtime/paper/ledger/account.json -out handover-out/account.json.enc
      - name: Keep the encrypted hand-over for the next parts and the next morning (7 days, for a long holiday)
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: paper-handover-night
          path: handover-out/account.json.enc
          retention-days: 7
          if-no-files-found: ignore
      - name: Keep the saved account (only when PAPER_LEDGER_BACKUP is yes, because this repository is public)
        if: ${{ always() && vars.PAPER_LEDGER_BACKUP == 'yes' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: paper-ledger-night
          path: runtime/paper/ledger/account.json
          retention-days: 90
          if-no-files-found: ignore

  reserve:
    # Audit K-07 (risk review of #279): the parts stop by their own deadlines, so the day is covered by the sum of the parts that ran. If one part ends at its
    # start, three parts (3 x 345 minutes) fall short of the 18-hour day and the night part would stop before the MCX 23:25 square-off. This fifth part takes
    # over then. On a normal day it starts at about midnight and does nothing (its stop time has passed, or it is before the desk's day).
    needs: night
    if: ${{ !cancelled() && needs.night.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Note this job's own deadline (the runner stops and saves 10 minutes before the job's 355-minute limit, however early it started; audit K-07)
        run: echo "PART_DEADLINE=$(( $(date +%s) + PART_LIMIT_MIN * 60 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        continue-on-error: true
        with:
          ref: paper-ledger
          path: ledger
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch the earlier parts' hand-overs (each part's own account, encrypted; audit K-01)
        continue-on-error: true               # none when every earlier part ended before saving one
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: paper-handover-*
          path: handover
      - name: Decrypt the hand-overs (openssl only; the key is in this step and the encrypting one, nowhere else)
        env:
          HANDOVER_KEY: ${{ secrets.PAPER_HANDOVER_KEY || secrets.MARKET_TAPE_KEY }}
        run: |
          mkdir -p handover-dec
          if [ "${#HANDOVER_KEY}" -lt 32 ]; then echo "::warning::no hand-over key (PAPER_HANDOVER_KEY, or MARKET_TAPE_KEY, of 32+ characters): this part starts from the relay's copy and the ledger branch's only"; exit 0; fi
          n=0
          for d in handover-prev handover; do                  # oldest first: the previous run's parts, then this run's
            for part in morning afternoon evening night reserve; do
              f="$d/paper-handover-$part/account.json.enc"
              [ -f "$f" ] || continue
              n=$((n + 1))
              if ! openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:HANDOVER_KEY -in "$f" -out "handover-dec/$(printf '%02d' $n)-$part.json" 2>/dev/null; then
                rm -f "handover-dec/$(printf '%02d' $n)-$part.json"; echo "::warning::the $part hand-over in $d could not be decrypted; left out"
              fi
            done
          done
          echo "decrypted $(ls handover-dec | wc -l) of $n hand-overs"
      - name: Start from the longest verified copy, the ledger branch's or an earlier part's own (the relay's is still used if it is longer; audit K-01)
        run: |
          mkdir -p runtime/paper/ledger
          files=""
          for f in handover-dec/*.json; do [ -f "$f" ] && files="$files $f"; done
          python -m quantdesk paper pick --branch ledger/account.json --out runtime/paper/ledger/account.json $files
          touch runtime/paper/picked.stamp                     # a part that never starts (a conflict) leaves its file older than this, and hands nothing over again
      - name: Run the paper runner to midnight, if the day's earlier parts have not got there
        env:
          LIVE_URL: ${{ vars.LIVE_URL }}
          LIVE_READ_TOKEN: ${{ secrets.LIVE_READ_TOKEN }}
          LIVE_INGEST_TOKEN: ${{ secrets.LIVE_INGEST_TOKEN }}
        run: python -m quantdesk paper run --until "$UNTIL" --deadline-epoch "$PART_DEADLINE" --final
      - name: Hand this part's own account to the next parts, encrypted (audit K-01; the plain account never leaves the runner)
        if: ${{ always() }}
        env:
          HANDOVER_KEY: ${{ secrets.PAPER_HANDOVER_KEY || secrets.MARKET_TAPE_KEY }}
        run: |
          if [ ! -f runtime/paper/ledger/account.json ]; then echo "no account file to hand over"; exit 0; fi
          if [ -f runtime/paper/picked.stamp ] && [ ! runtime/paper/ledger/account.json -nt runtime/paper/picked.stamp ]; then
            echo "::warning::this part did not start from its copy (see the runner's step), so that copy is not handed over again"; exit 0
          fi
          if [ "${#HANDOVER_KEY}" -lt 32 ]; then echo "::warning::no hand-over key (PAPER_HANDOVER_KEY, or MARKET_TAPE_KEY, of 32+ characters): the next part starts from the relay's copy only; add the secret (openssl rand -base64 32)"; exit 0; fi
          mkdir -p handover-out
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:HANDOVER_KEY -in runtime/paper/ledger/account.json -out handover-out/account.json.enc
      - name: Keep the encrypted hand-over for the next parts and the next morning (7 days, for a long holiday)
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: paper-handover-reserve
          path: handover-out/account.json.enc
          retention-days: 7
          if-no-files-found: ignore
      - name: Keep the saved account (only when PAPER_LEDGER_BACKUP is yes, because this repository is public)
        if: ${{ always() && vars.PAPER_LEDGER_BACKUP == 'yes' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: paper-ledger-reserve
          path: runtime/paper/ledger/account.json
          retention-days: 90
          if-no-files-found: ignore

  publish:
    needs: reserve
    # Off unless the owner sets the repository variable PAPER_LEDGER_BACKUP to yes: this repository is PUBLIC, so the branch, the artifacts and the logs would show the paper account (every thesis, position and result) to anyone.
    if: ${{ !cancelled() && needs.reserve.result != 'skipped' && vars.PAPER_LEDGER_BACKUP == 'yes' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write            # the paper-ledger branch and nothing else; this job holds no secret
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        continue-on-error: true
        with:
          path: art
      - name: Take the longest saved account that verifies
        run: |
          # no token in this step: the repository code runs here (hash chain, replay of every fill, flags)
          pick=""
          for part in morning afternoon evening night reserve; do                                   # the parts in the order they ran
            f=art/paper-ledger-$part/account.json
            [ -f "$f" ] || continue
            python -m quantdesk paper verify --file "$f" || { echo "::error::$f does not verify"; exit 1; }
            if [ -z "$pick" ]; then pick="$f"
            elif python -m quantdesk paper verify --file "$f" --extends "$pick" > /dev/null; then pick="$f"              # a later part continues the earlier one (the usual case)
            elif python -m quantdesk paper verify --file "$pick" --extends "$f" > /dev/null; then :                      # the earlier one is the longer: keep it
            else echo "::error::$pick and $f are two different histories"; exit 1; fi
          done
          if [ -z "$pick" ]; then echo "::error::the runner saved no account to publish"; exit 1; fi
          cp "$pick" "$RUNNER_TEMP/account.json"
          echo "publishing $pick"
      - name: Fetch the paper-ledger branch (into its own directory)
        env:
          GH_TOKEN: ${{ github.token }}
          LEDGER_WORK: ${{ runner.temp }}/ledger-branch
        run: deploy/paper_ledger.sh fetch
      - name: Check it continues the branch's account
        run: |
          # no token in this step either
          if [ -f "$RUNNER_TEMP/ledger-branch/account.json" ]; then
            python -m quantdesk paper verify --file "$RUNNER_TEMP/account.json" --extends "$RUNNER_TEMP/ledger-branch/account.json"
          fi
      - name: Add it to the branch (a new commit; never a force-push)
        env:
          GH_TOKEN: ${{ github.token }}
          LEDGER_WORK: ${{ runner.temp }}/ledger-branch
          ACCOUNT: ${{ runner.temp }}/account.json
        run: deploy/paper_ledger.sh push
