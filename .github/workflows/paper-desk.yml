          fi
          if [ "${#HANDOVER_KEY}" -lt 32 ]; then echo "::warning::no hand-over key (PAPER_HANDOVER_KEY, or MARKET_TAPE_KEY, of 32+ characters): the next part starts from the relay's copy only; add the secret (openssl rand -base64 32)"; exit 0; fi
