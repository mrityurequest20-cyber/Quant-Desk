# The manual paper runner: carries out the owner's queued PAPER orders through the paper risk gate, 06:00 to midnight IST (owner, 13 Nov 2026: "it will start at 6 a.m. and will
# close at 12 a.m.", so the whole MCX evening is covered). What can trade at a given hour is the risk gate's to decide (a segment's session and verified costs), not this
# workflow's: outside those hours the runner only watches, keeps the brakes and reports. PAPER MONEY ONLY.
#
# The owner places a paper trade by hand in the app; it waits in the relay's queue (docs/LIVE.md, /paper/*); this job takes it through quantdesk/paper (the risk gate, the broker, the
# hash-chained ledger) every few seconds and reports back. Nothing here can reach a broker: there is no broker credential in this workflow, and a test pins that.
#
# Six jobs, so that the ones that hold the relay keys cannot write and the one that can write holds no secret:
#   morning / afternoon / evening / night / reserve   hold LIVE_READ_TOKEN and LIVE_INGEST_TOKEN in the one step that runs the runner; `contents: read`. A hosted job may run six hours and
#                         the day is eighteen, so it is four parts (stop times 11:50, 17:40, 23:30 and 23:59 IST; the afternoon part holds the 15:20 sale and the 15:31
#                         settlement) and a reserve. Each part also stops by its own job's deadline (start + PART_LIMIT_MIN), saves and hands over: on a normal day
#                         that is a few minutes before its stop time (about 11:45, 17:31 and 23:16), and a part that starts early (the one before it ended early)
#                         hands over early instead of being killed with no last save. The day is covered by the parts that run, so the reserve takes over when one
#                         part has ended at its start; on a normal day it does nothing (audit K-07). The account lives on the relay (authoritative) and is restored
#                         at the start of each part, from the longest verified copy: the relay's, the ledger branch's, or an earlier part's own account,
#                         handed over ENCRYPTED (PAPER_HANDOVER_KEY, else MARKET_TAPE_KEY) so a fill the relay never took is not lost at a hand-over (audit K-01).
#   publish               `contents: write`, NO secret: verifies the saved account and ADDS it to the `paper-ledger` branch as a new commit (a backup and an audit trail). It refuses an
#                         account that does not continue the one already on the branch, and it never force-pushes.
# Started by deploy/scheduler.py like the other recorders (best-effort), or by hand. One run at a time: two runners on one account would be dangerous.
name: Paper runner

on:
  workflow_dispatch:
    inputs:
      handover:
        description: "The morning part hands over to the afternoon part at (HH:MM IST)"
        default: "11:50"
      handover2:
        description: "The afternoon part hands over to the evening part at (HH:MM IST)"
        default: "17:40"
      handover3:
        description: "The evening part hands over to the night part at (HH:MM IST)"
        default: "23:30"
      until:
        description: "The night part stops at (HH:MM IST)"
        default: "23:59"
      auto:
        description: "(AUTO is now ON for every run unless the repository variable PAPER_AUTO is no.) Switch AUTO v1 on for this run: the paper desk also decides for itself (one lot a trade, no cap on how many, through the same risk gate and its loss caps). Paper money only. Also on whenever the repository variable PAPER_AUTO is yes."
        type: boolean
        default: false
      reset_record:
        description: "ONLY when the owner has looked (audit K-04): AUTO v2's stored strategy record or open shadow book cannot be read, or the relay refuses a much smaller record (a catalogue change). Start it from zero: its learning so far is lost. The paper account is not touched."
        type: boolean
        default: false
      new_account:
        description: "ONLY for the very first session ever: start a new paper account because none is saved anywhere. Leave off otherwise: a missing account must stop the start, not begin the history again."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: paper-desk
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  PYTHONUNBUFFERED: "1"
  PART_LIMIT_MIN: "345"      # a part's runner stops by its job's start + this, ten minutes inside timeout-minutes (355), so an early start never ends in a kill with no last save (audit K-07)
  TZ: Asia/Kolkata
  HANDOVER: ${{ inputs.handover || '11:50' }}
  HANDOVER2: ${{ inputs.handover2 || '17:40' }}
  HANDOVER3: ${{ inputs.handover3 || '23:30' }}
  UNTIL: ${{ inputs.until || '23:59' }}
  NEW_ACCOUNT: ${{ inputs.new_account && 'yes' || 'no' }}
  PAPER_RESET_RECORD: ${{ inputs.reset_record && 'yes' || 'no' }}         # the owner's reset of AUTO v2's record (audit K-04); never set by a scheduled start
  PAPER_AUTO: ${{ (inputs.auto || vars.PAPER_AUTO != 'no') && 'yes' || 'no' }}       # ON by the owner's order of 13 Nov 2026 ("enable the self-trading ... a system which trades itself"); the repository variable PAPER_AUTO set to no switches it off

jobs:
  morning:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: read
      actions: read              # only to fetch the previous run's encrypted hand-over (audit K-01)
    steps:
      - name: Note this job's own deadline (the runner stops and saves 10 minutes before the job's 355-minute limit, however early it started; audit K-07)
        run: echo "PART_DEADLINE=$(( $(date +%s) + PART_LIMIT_MIN * 60 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        continue-on-error: true               # the branch does not exist before the first publish
        with:
          ref: paper-ledger
          path: ledger
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch the previous run's hand-overs (its night part's account, for this morning; audit K-01)
        continue-on-error: true               # none yet, or expired: the part starts from the relay's copy and the ledger branch's, as before
        env:
          GH_TOKEN: ${{ github.token }}       # actions: read only (this job's permissions); gh alone runs here, no repository code
        run: |
          runs=$(gh run list -R "$GITHUB_REPOSITORY" --workflow paper-desk.yml --branch main --event workflow_dispatch --limit 10 --json databaseId,status \
                 --jq ".[] | select(.databaseId != ${GITHUB_RUN_ID} and .status == \"completed\") | .databaseId")
          for prev in $runs; do                                # newest first; a run cancelled before it ran has no hand-over, so the one before it is taken
            if gh run download "$prev" -R "$GITHUB_REPOSITORY" --pattern 'paper-handover-*' --dir handover-prev; then echo "the hand-overs of run $prev"; break; fi
          done
          [ -d handover-prev ] || echo "no earlier run with a hand-over (kept 7 days)"
      - name: Decrypt the hand-overs (openssl only; the key is in this step and the encrypting one, nowhere else)
        env:
          HANDOVER_KEY: ${{ secrets.PAPER_HANDOVER_KEY || secrets.MARKET_TAPE_KEY }}
        run: |
          mkdir -p handover-dec
          if [ "${#HANDOVER_KEY}" -lt 32 ]; then echo "::warning::no hand-over key (PAPER_HANDOVER_KEY, or MARKET_TAPE_KEY, of 32+ characters): this part starts from the relay's copy and the ledger branch's only"; exit 0; fi
          n=0
          for d in handover-prev handover; do                  # oldest first: the previous run's parts, then this run's
            for part in morning afternoon evening night reserve; do
              f="$d/paper-handover-$part/account.json.enc"
              [ -f "$f" ] || continue
              n=$((n + 1))
              if ! openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:HANDOVER_KEY -in "$f" -out "handover-dec/$(printf '%02d' $n)-$part.json" 2>/dev/null; then
                rm -f "handover-dec/$(printf '%02d' $n)-$part.json"; echo "::warning::the $part hand-over in $d could not be decrypted; left out"
              fi
            done
          done
          echo "decrypted $(ls handover-dec | wc -l) of $n hand-overs"
      - name: Start from the longest verified copy, the ledger branch's or an earlier part's own (the relay's is still used if it is longer; audit K-01)
        run: |
          mkdir -p runtime/paper/ledger
          files=""
          for f in handover-dec/*.json; do [ -f "$f" ] && files="$files $f"; done
          python -m quantdesk paper pick --branch ledger/account.json --out runtime/paper/ledger/account.json $files
          touch runtime/paper/picked.stamp                     # a part that never starts (a conflict) leaves its file older than this, and hands nothing over again
      - name: Run the paper runner to the hand-over
        env:
          LIVE_URL: ${{ vars.LIVE_URL }}                           # the private live relay (docs/LIVE.md)
          LIVE_READ_TOKEN: ${{ secrets.LIVE_READ_TOKEN }}           # reads the live board
          LIVE_INGEST_TOKEN: ${{ secrets.LIVE_INGEST_TOKEN }}       # reads the order queue, posts results and the account
        run: |
          flag=""
          if [ "$NEW_ACCOUNT" = "yes" ]; then flag="--new-account"; fi
          python -m quantdesk paper run --until "$HANDOVER" --deadline-epoch "$PART_DEADLINE" $flag
      - name: Hand this part's own account to the next parts, encrypted (audit K-01; the plain account never leaves the runner)
        if: ${{ always() }}
        env:
          HANDOVER_KEY: ${{ secrets.PAPER_HANDOVER_KEY || secrets.MARKET_TAPE_KEY }}
        run: |
          if [ ! -f runtime/paper/ledger/account.json ]; then echo "no account file to hand over"; exit 0; fi
          if [ -f runtime/paper/picked.stamp ] && [ ! runtime/paper/ledger/account.json -nt runtime/paper/picked.stamp ]; then
            echo "::warning::this part did not start from its copy (see the runner's step), so that copy is not handed over again"; exit 0
          fi
          if [ "${#HANDOVER_KEY}" -lt 32 ]; then echo "::warning::no hand-over key (PAPER_HANDOVER_KEY, or MARKET_TAPE_KEY, of 32+ characters): the next part starts from the relay's copy only; add the secret (openssl rand -base64 32)"; exit 0; fi
          mkdir -p handover-out
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:HANDOVER_KEY -in runtime/paper/ledger/account.json -out handover-out/account.json.enc
      - name: Keep the encrypted hand-over for the next parts and the next morning (7 days, for a long holiday)
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: paper-handover-morning
          path: handover-out/account.json.enc
          retention-days: 7
          if-no-files-found: ignore
      - name: Keep the saved account (only when PAPER_LEDGER_BACKUP is yes, because this repository is public)
        if: ${{ always() && vars.PAPER_LEDGER_BACKUP == 'yes' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: paper-ledger-morning
          path: runtime/paper/ledger/account.json
          retention-days: 90
          if-no-files-found: ignore

  afternoon:
    needs: morning
    if: ${{ !cancelled() && needs.morning.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Note this job's own deadline (the runner stops and saves 10 minutes before the job's 355-minute limit, however early it started; audit K-07)
        run: echo "PART_DEADLINE=$(( $(date +%s) + PART_LIMIT_MIN * 60 ))" >> "$GITHUB_ENV"
