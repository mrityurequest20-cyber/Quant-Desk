# The manual paper runner: carries out the owner's queued PAPER orders through the paper risk gate, all through the session (09:00 to 15:35 IST). PAPER MONEY ONLY.
#
# The owner places a paper trade by hand in the app; it waits in the relay's queue (docs/LIVE.md, /paper/*); this job takes it through quantdesk/paper (the risk gate, the broker, the
# hash-chained ledger) every few seconds and reports back. Nothing here can reach a broker: there is no broker credential in this workflow, and a test pins that.
#
# Three jobs, so that the one that holds the relay keys cannot write and the one that can write holds no secret:
#   morning / afternoon   hold LIVE_READ_TOKEN and LIVE_INGEST_TOKEN in the one step that runs the runner; `contents: read`. A hosted job may run six hours and the session is longer,
#                         so the day is two halves (hand-over at 12:20). The account lives on the relay (authoritative) and is restored at the start of each half.
#   publish               `contents: write`, NO secret: verifies the saved account and ADDS it to the `paper-ledger` branch as a new commit (a backup and an audit trail). It refuses an
#                         account that does not continue the one already on the branch, and it never force-pushes.
# Started by deploy/scheduler.py like the other recorders (best-effort), or by hand. One run at a time: two runners on one account would be dangerous.
name: Paper runner

on:
  workflow_dispatch:
    inputs:
      handover:
        description: "The morning half hands over to the afternoon half at (HH:MM IST)"
        default: "12:20"
      until:
        description: "The afternoon half stops at (HH:MM IST)"
        default: "15:35"
      auto:
        description: "Switch AUTO v1 on for this run: the paper desk also decides for itself (one lot, tight limits, through the same risk gate). Paper money only. Also on whenever the repository variable PAPER_AUTO is yes."
        type: boolean
        default: false
      new_account:
        description: "ONLY for the very first session ever: start a new paper account because none is saved anywhere. Leave off otherwise: a missing account must stop the start, not begin the history again."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: paper-desk
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  PYTHONUNBUFFERED: "1"
  TZ: Asia/Kolkata
  HANDOVER: ${{ inputs.handover || '12:20' }}
  UNTIL: ${{ inputs.until || '15:35' }}
  NEW_ACCOUNT: ${{ inputs.new_account && 'yes' || 'no' }}
  PAPER_AUTO: ${{ (inputs.auto || vars.PAPER_AUTO == 'yes') && 'yes' || 'no' }}

jobs:
  morning:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        continue-on-error: true               # the branch does not exist before the first publish
        with:
          ref: paper-ledger
          path: ledger
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Put the ledger branch's copy of the account in place (the relay's copy is the one used if it is the longer)
        run: |
          mkdir -p runtime/paper/ledger
          if [ -f ledger/account.json ]; then cp ledger/account.json runtime/paper/ledger/account.json; echo "restored the ledger branch's account"; else echo "no ledger branch account yet"; fi
      - name: Run the paper runner to the hand-over
        env:
          LIVE_URL: ${{ vars.LIVE_URL }}                           # the private live relay (docs/LIVE.md)
          LIVE_READ_TOKEN: ${{ secrets.LIVE_READ_TOKEN }}           # reads the live board
          LIVE_INGEST_TOKEN: ${{ secrets.LIVE_INGEST_TOKEN }}       # reads the order queue, posts results and the account
        run: |
          flag=""
          if [ "$NEW_ACCOUNT" = "yes" ]; then flag="--new-account"; fi
          python -m quantdesk paper run --until "$HANDOVER" $flag
      - name: Keep the saved account (only when PAPER_LEDGER_BACKUP is yes, because this repository is public)
        if: ${{ always() && vars.PAPER_LEDGER_BACKUP == 'yes' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: paper-ledger-morning
          path: runtime/paper/ledger/account.json
          retention-days: 90
          if-no-files-found: ignore

  afternoon:
    needs: morning
    if: ${{ !cancelled() && needs.morning.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        continue-on-error: true
        with:
          ref: paper-ledger
          path: ledger
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Put the ledger branch's copy of the account in place
        run: |
          mkdir -p runtime/paper/ledger
          if [ -f ledger/account.json ]; then cp ledger/account.json runtime/paper/ledger/account.json; echo "restored the ledger branch's account"; else echo "no ledger branch account yet"; fi
      - name: Run the paper runner to the close
        env:
          LIVE_URL: ${{ vars.LIVE_URL }}
          LIVE_READ_TOKEN: ${{ secrets.LIVE_READ_TOKEN }}
          LIVE_INGEST_TOKEN: ${{ secrets.LIVE_INGEST_TOKEN }}
        run: python -m quantdesk paper run --until "$UNTIL"
      - name: Keep the saved account (only when PAPER_LEDGER_BACKUP is yes, because this repository is public)
        if: ${{ always() && vars.PAPER_LEDGER_BACKUP == 'yes' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: paper-ledger-afternoon
          path: runtime/paper/ledger/account.json
          retention-days: 90
          if-no-files-found: ignore

  publish:
    needs: afternoon
    # Off unless the owner sets the repository variable PAPER_LEDGER_BACKUP to yes: this repository is PUBLIC, so the branch, the artifacts and the logs would show the paper account (every thesis, position and result) to anyone.
    if: ${{ !cancelled() && needs.afternoon.result != 'skipped' && vars.PAPER_LEDGER_BACKUP == 'yes' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write            # the paper-ledger branch and nothing else; this job holds no secret
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        continue-on-error: true
        with:
          path: art
      - name: Take the longest saved account that verifies
        run: |
          # no token in this step: the repository code runs here (hash chain, replay of every fill, flags)
          m=art/paper-ledger-morning/account.json; a=art/paper-ledger-afternoon/account.json; pick=""
          for f in "$m" "$a"; do
            [ -f "$f" ] || continue
            python -m quantdesk paper verify --file "$f" || { echo "::error::$f does not verify"; exit 1; }
          done
          if [ -f "$m" ] && [ -f "$a" ]; then
            if python -m quantdesk paper verify --file "$a" --extends "$m" > /dev/null; then pick="$a"                 # the afternoon continues the morning (the usual case)
            elif python -m quantdesk paper verify --file "$m" --extends "$a" > /dev/null; then pick="$m"               # the morning is the longer
            else echo "::error::the morning's and the afternoon's accounts are two different histories"; exit 1; fi
          elif [ -f "$a" ]; then pick="$a"; elif [ -f "$m" ]; then pick="$m"; fi
          if [ -z "$pick" ]; then echo "::error::the runner saved no account to publish"; exit 1; fi
          cp "$pick" "$RUNNER_TEMP/account.json"
          echo "publishing $pick"
      - name: Fetch the paper-ledger branch (into its own directory)
        env:
          GH_TOKEN: ${{ github.token }}
          LEDGER_WORK: ${{ runner.temp }}/ledger-branch
        run: deploy/paper_ledger.sh fetch
      - name: Check it continues the branch's account
        run: |
          # no token in this step either
          if [ -f "$RUNNER_TEMP/ledger-branch/account.json" ]; then
            python -m quantdesk paper verify --file "$RUNNER_TEMP/account.json" --extends "$RUNNER_TEMP/ledger-branch/account.json"
          fi
      - name: Add it to the branch (a new commit; never a force-push)
        env:
          GH_TOKEN: ${{ github.token }}
          LEDGER_WORK: ${{ runner.temp }}/ledger-branch
          ACCOUNT: ${{ runner.temp }}/account.json
        run: deploy/paper_ledger.sh push
