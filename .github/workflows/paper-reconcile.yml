# Paper reconcile: books fills the relay never received, from a plan in docs/reconcile/, as reconstructed rows appended to the paper account
# (quantdesk/paperlink/reconcile.py; audit K-01). PAPER MONEY ONLY: nothing here can reach a broker, and no broker credential is in this file.
#
# Started by hand only. A dry run unless `apply` is ticked AND `confirm` is the plan's id typed out. It shares the paper runner's concurrency group, so it can
# never run beside it, and it refuses unless the relay's ledger is exactly the one the plan continues (so a second run changes nothing).
# The relay keys are in the one step that reconciles; `contents: read`; the run log carries counts and a fingerprint only (this repository is public).
name: Paper reconcile

on:
  workflow_dispatch:
    inputs:
      plan:
        description: "The plan's id: docs/reconcile/<id>.json (for example 2026-11-20)"
        required: true
      apply:
        description: "Send the reconciled account to the relay (off: a dry run that changes nothing)"
        type: boolean
        default: false
      confirm:
        description: "To apply: type the plan's id again"
        default: ""

permissions:
  contents: read

concurrency:
  group: paper-desk
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  PYTHONUNBUFFERED: "1"
  TZ: Asia/Kolkata

jobs:
  reconcile:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check the inputs (no secret here)
        env:
          PLAN: ${{ inputs.plan }}
          APPLY: ${{ inputs.apply }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if ! [[ "$PLAN" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}[a-z0-9-]{0,16}$ ]]; then echo "the plan id must look like 2026-11-20"; exit 1; fi
          if [ ! -f "docs/reconcile/$PLAN.json" ]; then echo "no plan docs/reconcile/$PLAN.json"; exit 1; fi
          if [ "$APPLY" = "true" ] && [ "$CONFIRM" != "$PLAN" ]; then echo "to apply, type the plan's id in confirm"; exit 1; fi
          echo "PLAN_FILE=docs/reconcile/$PLAN.json" >> "$GITHUB_ENV"
      - name: Fetch the recorded chains the plan names (public release files; no secret here)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p runtime/reconcile
          python3 -I -c "import json,sys; [print(f) for f in json.load(open(sys.argv[1]))['chain_files']]" "$PLAN_FILE" | while read -r f; do
            if ! [[ "$f" =~ ^[A-Za-z0-9-]+/[A-Za-z0-9_.-]+\.parquet$ ]]; then echo "a chain file must be <release>/<name>.parquet"; exit 1; fi
            gh release download "${f%%/*}" -R "$GITHUB_REPOSITORY" -p "${f#*/}" -D runtime/reconcile
          done
          ls runtime/reconcile/*.parquet > /dev/null
      - name: Reconcile (the relay keys are in this step only)
        env:
          LIVE_URL: ${{ vars.LIVE_URL }}
          LIVE_READ_TOKEN: ${{ secrets.LIVE_READ_TOKEN }}
          LIVE_INGEST_TOKEN: ${{ secrets.LIVE_INGEST_TOKEN }}
          APPLY: ${{ inputs.apply }}
        run: |
          flag=""
          if [ "$APPLY" = "true" ]; then flag="--apply"; fi
          python -m quantdesk paper reconcile --plan "$PLAN_FILE" --chains runtime/reconcile/*.parquet $flag
