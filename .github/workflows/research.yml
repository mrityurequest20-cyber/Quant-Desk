# Edge research on real NIFTY / BANKNIFTY / India VIX data (Yahoo): pre-registered hypotheses,
# Newey-West t-stats, a chronological holdout, Benjamini-Hochberg false-discovery control and the
# options cost hurdle. The report lands on the `research` branch and in the run summary.
name: Edge research

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 6"     # Saturdays 09:47 IST: re-test every week as new data arrives

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pull the data warehouse (NSE bhavcopy + participant OI)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download warehouse --pattern 'fo_bhav_*.parquet' --pattern 'participant_oi_*.parquet' --dir runtime/warehouse --clobber || echo "no warehouse yet"
      - name: Restore the append-only experiment ledger
        run: deploy/research-ledger.sh
      - name: Test the hypotheses
        run: python -m quantdesk research --out _research --experiment-log _research/experiment_log.jsonl --warehouse runtime/warehouse
      - name: Publish the report
        run: |
          cat _research/edge_report.md >> "$GITHUB_STEP_SUMMARY"
          [ -f _research/data_report.md ] && cat _research/data_report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: research-report
          path: _research/
          if-no-files-found: error

  publish:
    needs: research
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: research-report
          path: _research
      - run: deploy/push-dir.sh _research research "edge research $(TZ=Asia/Kolkata date '+%F %H:%M') IST"
