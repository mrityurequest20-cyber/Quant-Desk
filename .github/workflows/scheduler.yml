# Starts the live desk when it should be running and isn't. GitHub delivered live.yml's own 08:52 IST cron
# 6½–7 hours late on 29 Sep – 1 Oct 2026 (at 15:19–15:46 IST), so the desk lost two sessions. This check
# fires every 10 minutes around the clock (each firing can be late too, but some land in the morning) and
# starts the desk by workflow_dispatch, which runs at once. It respects the kill switch: a run cancelled
# today keeps the desk stopped for the day. The rules are in deploy/scheduler.py. Each check takes seconds.
name: Desk scheduler

on:
  schedule:
    - cron: "*/10 * * * 0-5"     # Sunday too: a late Sunday-night firing can land on Monday morning
  workflow_dispatch:

permissions:
  actions: write             # list live.yml runs and dispatch it
  contents: read

concurrency:
  group: desk-scheduler
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          sparse-checkout: |
            config
            deploy
      - name: Start the desk if it should be running and isn't
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 deploy/scheduler.py
