# Re-publish the read-only site (the phone app) when the app itself changes, without trading.
#
# The paper desk that used to republish the site mid-session was retired on 6 Nov 2026 (record.yml publishes no site),
# so this job publishes at once. It never touches the recorder's concurrency group.
name: Publish site

on:
  push:
    branches: [main]
    paths: ["quantdesk/web/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: write            # push the gh-pages branch

concurrency:
  group: site-publish        # a newer app version supersedes a waiting one
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore the journal
        run: deploy/journal.sh restore
      - name: Publish the site with the new app
        run: python -m quantdesk intraday export-site --dir _site --sessions 2 && deploy/push-dir.sh _site gh-pages "site (app update)"
