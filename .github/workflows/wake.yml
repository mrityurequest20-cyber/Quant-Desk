# The desk's overnight waiter (deploy/scheduler.py arms it). GitHub's scheduled events reach this repository only a
# few times a day and hours late, so no cron can be trusted to land at 08:30 IST. Instead, any scheduler firing in the
# six hours before a session dispatches this workflow, which runs at once and sleeps on its runner until the wake-up
# time, then runs the scheduler's check, which starts live.yml. Hosted minutes are free on a public repository.
# Cancelling this run disarms it; cancelling a live.yml run stays the kill switch for the day.
name: Desk waiter

on:
  workflow_dispatch:
    inputs:
      at:
        description: "Wake-up time (ISO 8601, IST), at most ~5h40m ahead"
        required: true

permissions:
  actions: write             # list live.yml runs and dispatch it
  contents: read

concurrency:
  group: desk-wake
  cancel-in-progress: false

jobs:
  wait:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          sparse-checkout: |
            config
            deploy
      - name: Sleep until the wake-up, then start the desk if it should be running and isn't
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          AT: ${{ inputs.at }}
        run: python3 deploy/scheduler.py --wake "$AT"
