<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0C10" id="meta-theme">
<meta name="color-scheme" content="dark light">
<meta name="description" content="QuantDesk: an automated NIFTY / BANKNIFTY options paper-trading desk. Live read, chart, trades, the brain and the news it reads.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="QuantDesk">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>QuantDesk</title>
<style>
@font-face{font-family:"Geist";font-style:normal;font-weight:100 900;font-display:swap;src:url("fonts/geist-sans.woff2") format("woff2")}
@font-face{font-family:"Geist Mono";font-style:normal;font-weight:100 900;font-display:swap;src:url("fonts/geist-mono.woff2") format("woff2")}

/* ---- tokens (design: "Hairline terminal"). Cool neutrals, one ink-blue accent for interaction, green/red only for
   direction and P&L, amber only for waiting and warnings. Light on :root; dark by system preference unless the viewer
   chose light, and by choice. Names are the ones app.js and the charts read. ---- */
:root{color-scheme:light;
--bg:#f4f5f8;--panel:#ffffff;--panel2:#f8f9fb;--raise:#eef0f4;--line:#e3e6eb;--line2:#d2d7df;
--fg:#0e1318;--fg2:#48505e;--fg3:#666f7d;
--acc:#3352d0;--acc-hi:#3352d0;--acc-bg:#ecf0ff;--on-acc:#ffffff;
--up:#07855a;--dn:#cc2d42;--up-bg:#e5f4ed;--dn-bg:#fceaec;--cup:#0e9f6e;--cdn:#e03e4f;
--warn:#955800;--warn-bg:#fff2da;
--grid:#eef0f3;--axis:#d2d7df;--scrim:rgba(14,19,24,.42);--shadow:none;--glass:#f4f5f8;--vwap:#c27a00;
--sans:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
--mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
--bg:#0a0c10;--panel:#0f1217;--panel2:#13171d;--raise:#171b22;--line:#1e232b;--line2:#2b313b;
--fg:#e8eaed;--fg2:#a4acb8;--fg3:#7e8794;
--acc:#7d95ff;--acc-hi:#7d95ff;--acc-bg:#1a2142;--on-acc:#0a0c10;
--up:#2fc48d;--dn:#ff6b7a;--up-bg:#0f2a20;--dn-bg:#35161c;--cup:#2fc48d;--cdn:#ff6b7a;
--warn:#f2b13b;--warn-bg:#2e2410;
--grid:#14181e;--axis:#2b313b;--scrim:rgba(0,0,0,.62);--glass:#0a0c10;--vwap:#e8a33a}}
:root[data-theme="dark"]{color-scheme:dark;
--bg:#0a0c10;--panel:#0f1217;--panel2:#13171d;--raise:#171b22;--line:#1e232b;--line2:#2b313b;
--fg:#e8eaed;--fg2:#a4acb8;--fg3:#7e8794;
--acc:#7d95ff;--acc-hi:#7d95ff;--acc-bg:#1a2142;--on-acc:#0a0c10;
--up:#2fc48d;--dn:#ff6b7a;--up-bg:#0f2a20;--dn-bg:#35161c;--cup:#2fc48d;--cdn:#ff6b7a;
--warn:#f2b13b;--warn-bg:#2e2410;
--grid:#14181e;--axis:#2b313b;--scrim:rgba(0,0,0,.62);--glass:#0a0c10;--vwap:#e8a33a}

/* ---- base ---- */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font:13px/1.42 var(--sans);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overscroll-behavior-y:none;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.up{color:var(--up)}.dn{color:var(--dn)}.f2{color:var(--fg2)}.f3{color:var(--fg3)}.acc{color:var(--acc)}.warn{color:var(--warn)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.lbl{font-size:10.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--fg3)}

/* ---- app bar ---- */
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;min-height:calc(52px + env(safe-area-inset-top,0px));
padding:env(safe-area-inset-top,0px) 4px 0 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.bar h1{margin:0;flex:1;min-width:0;display:flex;align-items:center;gap:10px;font-size:15px;font-weight:500;letter-spacing:-.01em;white-space:nowrap}
.bar h1 .logo{width:22px;height:22px;flex:none}
.bar h1 small{font-size:12px;font-weight:400;color:var(--fg3);letter-spacing:0;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:13px;border:1px solid var(--line);font-size:11.5px;color:var(--fg2);white-space:nowrap}
.pill b{font-weight:500;color:var(--fg)}
.pill .dot{width:6px;height:6px;border-radius:3px;background:var(--fg3);flex:none}
.pill.live .dot{background:var(--up)}
.pill.paused,.pill.stale{background:var(--warn-bg);border-color:var(--warn-bg);color:var(--warn)}
.pill.paused .dot,.pill.stale .dot{background:var(--warn)}.pill.paused b,.pill.stale b{color:var(--warn)}
.pill.net{border-style:dashed;border-color:var(--line2)}.pill.net .dot{background:none;border:1px solid var(--fg3)}
.ib{width:44px;height:44px;display:inline-grid;place-items:center;border-radius:8px;color:var(--fg2);flex:none}
.ib:active{background:var(--raise)}

/* ---- layout: phone first; sections are full-bleed bands split by hairlines, not cards ---- */
main{max-width:760px;margin:0 auto;padding:0 16px calc(84px + env(safe-area-inset-bottom,0px))}
main>section{animation:fade .16s ease-out}
@keyframes fade{from{opacity:.5}to{opacity:1}}
.grp,.panel{margin:8px -16px 0;background:var(--panel);border-top:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0}
.grp>.panel{margin:0;border-bottom:0}
.grp>.sec-h+*,.grp>.dayh+*{border-top:1px solid var(--line)}
.grp>.chips+.rows{border-top:1px solid var(--line)}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:34px;padding:0 16px}
.sec-h h2{margin:0;font-size:10.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--fg3);white-space:nowrap}
.sec-h .hint{font-size:11px;color:var(--fg3);text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.link{display:inline-flex;align-items:center;gap:2px;min-height:34px;font-size:12px;color:var(--acc);white-space:nowrap}
.link svg.i{width:14px;height:14px}
.pad{padding:12px 16px}
.rows>*+*{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:10px;min-width:0}.grow{flex:1;min-width:0}
.stack{display:grid}
.subnav{position:sticky;top:calc(52px + env(safe-area-inset-top,0px));z-index:15;margin:0 -16px;padding:10px 16px;background:var(--bg)}
.wide-only{display:none!important}
.dgrid>.col{min-width:0}
.cgrid{display:flex;flex-direction:column}.cgrid>.col{display:contents}
.o1{order:1}.o2{order:2}.o3{order:3}.o4{order:4}.o5{order:5}

/* ---- tab bar: bottom on phones, a labelled sidebar on wide screens ---- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:var(--bg);
border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .brand{display:none}
.tabbar button{position:relative;height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:500;
color:var(--fg3);min-width:0}
.tabbar button svg.i{width:22px;height:22px}
.tabbar button[aria-selected="true"]{color:var(--fg)}
.tabbar button[aria-selected="true"]::before{content:"";position:absolute;top:-1px;left:calc(50% - 12px);width:24px;height:2px;border-radius:1px;background:var(--acc)}
.tabbar .badge{position:absolute;top:8px;left:calc(50% + 7px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--acc);color:var(--on-acc);
font-size:10px;font-weight:600;line-height:16px;text-align:center}

/* ---- controls ---- */
.seg{display:inline-flex;padding:2px;gap:2px;background:var(--raise);border-radius:8px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{height:36px;padding:0 12px;border-radius:6px;font-size:12.5px;color:var(--fg2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--fg);box-shadow:0 0 0 1px var(--line)}
.seg.full{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;width:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--line);font-size:12px;color:var(--fg2);white-space:nowrap;flex:none}
.chip[aria-pressed="true"]{border-color:var(--acc-bg);color:var(--acc);background:var(--acc-bg)}
.chip i{width:12px;height:0;border-top:2px dashed currentColor;display:inline-block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 14px;border-radius:6px;border:1px solid var(--line2);
background:var(--panel);font-size:13px;font-weight:500;color:var(--fg)}
.btn:active{background:var(--raise)}
.btn svg.i{width:16px;height:16px}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.btn.danger{color:var(--dn);border-color:color-mix(in srgb,var(--dn) 45%,transparent)}
.btn.block{width:100%}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* ---- atoms ---- */
.tag{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:4px;font-size:11px;font-weight:400;white-space:nowrap;flex:none}
.tag.bull{color:var(--up);background:var(--up-bg)}.tag.bear{color:var(--dn);background:var(--dn-bg)}
.tag.flat,.tag.line{border:1px solid var(--line);color:var(--fg2);background:none}
.tag.acc{color:var(--acc);background:var(--acc-bg)}.tag.warn{color:var(--warn);background:var(--warn-bg)}
.tag.dash{border:1px dashed var(--line2);color:var(--fg2);background:none}
.tag svg.i{width:11px;height:11px;stroke-width:2.4}
.chg{display:inline-block;font-size:11.5px}.chg.up{color:var(--up)}.chg.dn{color:var(--dn)}.chg.flat{color:var(--fg3)}
.grade{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:5px;font-size:12px;font-weight:500;border:1px dashed var(--line2);color:var(--fg3);flex:none}
.grade.A,.grade.B{color:var(--up);background:var(--up-bg);border:0}.grade.C{color:var(--warn);background:var(--warn-bg);border:0}
.grade.D,.grade.F{color:var(--dn);background:var(--dn-bg);border:0}
.info{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;border:1px solid var(--line2);font:500 10px var(--sans);color:var(--fg3);
vertical-align:1px;margin-left:4px;flex:none}
.empty{padding:24px 16px;text-align:center;color:var(--fg3);font-size:12.5px;line-height:1.5}
.empty svg.i{width:26px;height:26px;display:block;margin:0 auto 8px;color:var(--line2)}
.skel{display:block;height:10px;border-radius:3px;background:var(--raise);animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{opacity:.55}}
.note{font-size:12px;line-height:1.5;color:var(--fg3);padding:16px 0 0}
.note b{color:var(--fg2);font-weight:500}
.banner{display:flex;gap:10px;align-items:flex-start;margin:8px -16px 0;padding:10px 16px;background:var(--raise);color:var(--fg2);font-size:12.5px;line-height:1.45}
.banner svg.i{width:16px;height:16px;margin-top:1px;flex:none}
.banner.warn{background:var(--warn-bg);color:var(--warn)}
.banner.err{background:var(--dn-bg);color:var(--dn)}
.banner.net{background:none;border-top:1px dashed var(--line2);border-bottom:1px dashed var(--line2)}
.banner.install{background:var(--acc-bg);color:var(--fg)}.banner.install svg.i{color:var(--acc)}
.bm{position:relative;display:inline-block;width:56px;height:4px;border-radius:2px;background:var(--line2);flex:none}
.bm i{position:absolute;top:0;height:4px}
.bm::after{content:"";position:absolute;left:50%;top:-3px;width:1px;height:10px;background:var(--fg3)}
.bm.big{display:block;width:auto;height:6px;border-radius:3px}.bm.big i{height:6px}.bm.big::after{top:-3px;height:12px}

/* ---- desk ---- */
.nowbar{display:grid;gap:4px;margin:0 -16px;padding:10px 16px 11px;background:var(--panel);border-bottom:1px solid var(--line)}
.nowbar .l1{display:flex;align-items:center;gap:10px;min-width:0}
.nowbar .dot{width:7px;height:7px;border-radius:4px;background:var(--fg3);flex:none}
.nowbar .dot.in{background:var(--acc)}.nowbar .dot.wait{background:var(--warn)}.nowbar .dot.aside{background:var(--fg3)}
.nowbar .hd{flex:1;min-width:0;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nowbar .tm{font-size:11.5px;color:var(--fg3)}
.nowbar .why{display:grid;gap:2px;font-size:12px;color:var(--fg3);padding-left:17px}
.nowbar .why b{font-weight:500;color:var(--fg2)}
.acct{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:2px 16px 12px}
.acct span.k{display:block;font-size:11px;color:var(--fg3)}
.acct .eq{font-size:26px;font-weight:300;letter-spacing:-.02em;line-height:1.15}
.acct .day{font-size:17px;text-align:right;white-space:nowrap}.acct .day small{font-size:12px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border-top:1px solid var(--line)}
.stats>div{background:var(--panel);padding:8px 10px 9px;min-width:0}.stats>div:first-child{padding-left:16px}
.stats span{display:block;font-size:10.5px;color:var(--fg3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats b{display:block;font-weight:400;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter{height:3px;border-radius:2px;background:var(--raise);margin-top:4px;overflow:hidden}.meter i{display:block;height:100%;background:var(--acc)}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) 96px auto;align-items:center;gap:8px 12px;padding:10px 16px 12px;width:100%;text-align:left}
.mrow:active{background:var(--panel2)}
.mrow .nm{font-size:13.5px;font-weight:500}
.mrow .sub{font-size:11px;color:var(--fg3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .px{text-align:right}.mrow .px .v{font-size:15px}
.mrow .desk{grid-column:1/-1;display:flex;align-items:center;gap:6px 16px;flex-wrap:wrap;min-width:0;font-size:11.5px;color:var(--fg3)}
.mrow .desk b{font-weight:400;color:var(--fg)}
.mrow .desk .bias{display:flex;align-items:center;gap:7px}
.mrow .st{grid-column:1/-1;font-size:11.5px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:-2px}
.spark{width:96px;height:28px;display:block}
.pos{display:grid;gap:6px;padding:10px 16px 12px}
.pos .r1,.pos .r2{display:flex;align-items:baseline;justify-content:space-between;gap:12px;min-width:0}
.pos .t1{font-size:14px;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pos .t1 small{font-size:13px;font-weight:400;color:var(--fg3)}
.pos .pnl{font-size:15px;white-space:nowrap}
.pos .r2{font-size:11.5px;color:var(--fg3)}
.pos .prem{font-size:12px;color:var(--fg2)}.pos .prem b{font-weight:400;color:var(--fg)}
.pos .meta{font-size:11.5px;color:var(--fg3)}
.pos .btns{margin-top:6px}
.track{position:relative;height:30px;margin:2px 0 0}
.track .ln{position:absolute;left:0;right:0;top:5px;height:4px;border-radius:2px;background:var(--line2)}
.track .fill{position:absolute;top:5px;height:4px}
.track .en{position:absolute;top:1px;width:1px;height:12px;background:var(--fg2)}
.track .sp{position:absolute;top:2px;width:10px;height:10px;border-radius:5px;margin-left:-5px;background:var(--panel);border:2px solid var(--fg)}
.track .l,.track .r{position:absolute;top:16px;font-size:11px;color:var(--fg3);white-space:nowrap}.track .l{left:0}.track .r{right:0}
.legs{width:100%;border-collapse:collapse;font-size:12px}
.legs th{font-size:10.5px;font-weight:500;color:var(--fg3);text-align:right;padding:4px 0}
.legs td{text-align:right;padding:5px 0;border-top:1px solid var(--line)}
.legs th:first-child,.legs td:first-child{text-align:left}
.arow{display:grid;gap:4px;padding:10px 16px 12px}
.arow .l1{display:flex;align-items:center;gap:8px;min-width:0}
.arow .l1 .t{margin-left:auto;font-size:11.5px;color:var(--fg3);white-space:nowrap}
.arow .l2{font-size:12px;color:var(--fg2)}.arow .l2 b{font-weight:400;color:var(--fg)}
.arow .l3{font-size:12px;color:var(--fg3)}
.gpulse{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line)}
.gpulse>button{display:flex;flex-direction:column;gap:1px;padding:7px 12px 8px;background:var(--panel);text-align:left;min-width:0}
.gpulse>button:nth-child(3n+1){padding-left:16px}
.gpulse .n{font-size:10.5px;color:var(--fg3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gpulse .v{white-space:nowrap}.gpulse .v small{font-size:11px;color:var(--fg3)}

/* ---- list rows: news, trades, thoughts ---- */
.li{display:flex;flex-direction:column;gap:6px;width:100%;padding:10px 16px 12px;text-align:left}
.li .ttl{font-size:13.5px;font-weight:400;line-height:1.35;color:var(--fg);text-decoration:none;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.li .meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--fg3)}
.li .readers{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--fg3)}
.li.muted{opacity:.6}
.trow{display:grid;grid-template-columns:44px minmax(0,1fr) auto 24px;column-gap:10px;align-items:center;width:100%;padding:9px 16px 10px;text-align:left}
.trow:active{background:var(--panel2)}
.trow .tm{display:flex;flex-direction:column;font-size:11.5px;line-height:1.35;color:var(--fg3)}.trow .tm b{font-weight:400;color:var(--fg2)}
.trow .t1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.trow .t2{font-size:11px;color:var(--fg3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .v{text-align:right;white-space:nowrap}.trow .v small{display:block;font-size:11px;color:var(--fg3)}
.dayh{display:flex;justify-content:space-between;align-items:center;min-height:34px;padding:0 16px;font-size:10.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--fg3)}
.dayh>:last-child{font-size:12px;letter-spacing:0;text-transform:none;font-weight:400}
.th{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;width:100%;padding:10px 16px;text-align:left}
.th .tm{font-size:11.5px;color:var(--fg3);padding-top:1px}
.th .act{font-size:13px;margin-top:3px;line-height:1.4}
.th .act.trade{color:var(--acc)}
.th .nar{font-size:12px;color:var(--fg2);margin-top:3px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.th.open .nar{display:block}
.logrow{display:grid;grid-template-columns:40px 72px 40px minmax(0,1fr);column-gap:10px;padding:7px 16px;font-size:12.5px;width:100%;text-align:left}
.logrow .tm{color:var(--fg3)}.logrow .s{color:var(--fg2)}.logrow .b{text-align:right}
.logrow.ent{background:var(--acc-bg)}.logrow.exit{background:var(--raise)}
.logrow .a{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---- chart ---- */
.cpanel{margin:0 -16px;background:var(--panel);border-bottom:1px solid var(--line)}
.qhead{display:flex;flex-direction:column;gap:2px;padding:12px 16px 10px}
.qhead .k{font-size:11.5px;color:var(--fg3)}
.qhead .r{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.qhead .px{font-size:26px;font-weight:300;letter-spacing:-.02em;line-height:1.15}
.qhead .ch{font-size:13px}
.qhead .hl{font-size:11.5px;color:var(--fg3)}
.tools{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:0 16px 10px}
.tools>.seg{flex:none}                 /* each selector stays whole; the row wraps on a phone instead of clipping */
.tools .ib{width:40px;height:40px;margin-left:auto;border:1px solid var(--line)}
.chartbox{position:relative;height:clamp(300px,52vh,580px);background:var(--panel);border-top:1px solid var(--line)}
.chartbox .lw{position:absolute;inset:0}
.chartbox.fs{position:fixed;inset:0;z-index:60;height:auto;margin:0;border:0;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.chartbox.fs .lw{inset:calc(44px + env(safe-area-inset-top,0px)) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.ohlc{position:absolute;z-index:4;top:6px;left:10px;right:76px;pointer-events:none;font:10.5px/1.5 var(--mono);color:var(--fg2);font-variant-numeric:tabular-nums}
.ohlc b{color:var(--fg);font-weight:500}.ohlc .k{color:var(--fg3)}
.ohlc .r2{color:var(--fg3)}
.chartbox.fs .ohlc{top:calc(50px + env(safe-area-inset-top,0px))}
.fsbar{display:none}
.chartbox.fs .fsbar{display:flex;position:absolute;z-index:5;top:env(safe-area-inset-top,0px);left:0;right:0;height:44px;align-items:center;gap:10px;padding:0 4px 0 16px;
border-bottom:1px solid var(--line);font-weight:500}
.chartbox .empty{position:absolute;inset:0;display:grid;place-items:center}
#c-levels{padding:10px 16px 12px;border-top:1px solid var(--line)}
.read{display:grid;gap:10px;padding:10px 16px 14px}
.read .sc{display:flex;align-items:center;gap:12px}
.read .sc .v{font-size:24px;font-weight:300;letter-spacing:-.02em;min-width:64px}
.read .sc .g{flex:1;display:grid;gap:5px}
.gscale{display:flex;justify-content:space-between;font-size:10.5px;color:var(--fg3)}
.read .tags{display:flex;flex-wrap:wrap;gap:6px}
.read .tags .tag{height:22px;font-size:11.5px}
.narr{margin:0;font-size:13px;line-height:1.55;color:var(--fg2)}
.track-rec{font-size:11.5px;color:var(--fg3)}
.flags{display:grid;gap:6px}
.flags div{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--warn)}.flags svg.i{width:15px;height:15px;margin-top:1px}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line)}
.facts>div{background:var(--panel);padding:8px 12px 9px 16px;min-width:0}
.facts span{display:block;font-size:10.5px;color:var(--fg3)}.facts b{display:block;font-size:13.5px;font-weight:400;margin-top:1px;line-height:1.35;overflow-wrap:anywhere}
.evl{display:grid}
.ev{display:grid;grid-template-columns:minmax(0,1fr) 72px 30px;column-gap:12px;row-gap:3px;align-items:center;padding:9px 16px 10px}
.ev+.ev{border-top:1px solid var(--line)}
.ev .f{display:flex;align-items:baseline;gap:8px;min-width:0;white-space:nowrap;overflow:hidden}
.ev .f b{font-weight:500;overflow:hidden;text-overflow:ellipsis}.ev .f small{font-size:11px;color:var(--fg3)}
.ev .f .ln{font-size:10.5px;padding:0 5px;border-radius:3px;background:var(--acc-bg);color:var(--acc)}
.ev .w{text-align:right;font-size:12px;color:var(--fg2)}
.ev .o{grid-column:1/-1;font-size:12px;color:var(--fg3);line-height:1.45}
.ev.probation{opacity:.55}.ev.probation .f .ln{background:none;border:1px dashed var(--line2);color:var(--fg2)}
.dv{position:relative;height:4px;border-radius:2px;background:var(--line2)}
.dv::after{content:"";position:absolute;left:50%;top:-3px;width:1px;height:10px;background:var(--fg3)}
.dv i{position:absolute;top:0;bottom:0}
.more{display:flex;align-items:center;justify-content:center;gap:4px;width:100%;min-height:40px;border-top:1px solid var(--line);font-size:12px;color:var(--acc)}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{font-size:10.5px;font-weight:500;color:var(--fg3);text-align:right;padding:7px 8px;white-space:nowrap}
.tbl td{text-align:right;padding:8px;border-top:1px solid var(--line);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left;padding-left:16px}.tbl th:last-child,.tbl td:last-child{padding-right:16px}
.tbl td:first-child{white-space:normal;min-width:84px}
.tbl tr.spot td{background:var(--acc-bg);color:var(--acc)}
.tbl td small.sub{display:inline;font-size:11px;color:var(--fg3);margin-left:6px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.sw{display:inline-block;width:10px;height:2px;vertical-align:middle;margin-right:7px;border-radius:1px}

/* ---- performance ---- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line)}
.kpi{background:var(--panel);padding:8px 8px 9px 12px;min-width:0}
.kpi:nth-child(4n+1){padding-left:16px}
.kpi span{display:block;font-size:10.5px;color:var(--fg3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi b{display:block;font-size:14px;font-weight:400;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* small phones (≤380 px): four stat columns get cramped, so the account strip and KPI grids go two by two */
@media (max-width:380px){.kpis,.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi:nth-child(4n+1),.stats>div:first-child{padding-left:12px}.kpi:nth-child(2n+1),.stats>div:nth-child(2n+1){padding-left:16px}.acct .eq{font-size:24px}}
.eqc{height:200px;position:relative;margin:4px 0 8px}
.hb{display:grid;grid-template-columns:minmax(80px,32%) minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 16px;font-size:12.5px}
.hb+.hb{border-top:1px solid var(--line)}
.hb .bar2{position:relative;height:8px}.hb .bar2::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--line2)}

/* ---- brain ---- */
.regime{display:grid;gap:8px;padding:10px 16px 12px}
.regime .big{font-size:20px;font-weight:400;letter-spacing:-.01em;text-transform:capitalize}
.regime .big.on{color:var(--up)}.regime .big.offr{color:var(--dn)}.regime .big.mixed{color:var(--warn)}
.regime .tags{display:flex;gap:6px;flex-wrap:wrap}
#bgraph{padding:4px 12px 12px}
#bgraph svg{display:block;width:100%;height:auto}
#bgraph text{font-family:var(--sans);font-size:10.5px;fill:var(--fg2)}#bgraph text.t{fill:var(--fg);font-weight:500}
.grow-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:2px 12px;align-items:center;padding:8px 16px}
.grow-row .n{display:flex;align-items:center;gap:8px;min-width:0}
.grow-row .n span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grow-row .n i{width:6px;height:6px;border-radius:50%;background:var(--line2);flex:none}.grow-row .n i.on{background:var(--up)}
.grow-row .v{color:var(--fg2);text-align:right}
.grow-row .s{grid-column:1/-1;font-size:11px;color:var(--fg3)}
.reg-h{display:flex;align-items:center;min-height:30px;padding:0 16px;background:var(--panel2);font-size:10.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--fg3)}

/* ---- sheet, toast, pull-to-refresh ---- */
.sheet{position:fixed;inset:0;z-index:70;display:flex;align-items:flex-end;justify-content:center;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .2s}
.sheet.open{opacity:1;pointer-events:auto}
.sheet .body{width:100%;max-width:640px;max-height:92vh;overflow:auto;overscroll-behavior:contain;background:var(--panel);border-radius:14px 14px 0 0;
padding:0 16px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(24px);transition:transform .2s ease-out;box-shadow:0 -8px 28px rgba(0,0,0,.28)}
.sheet.open .body{transform:none}
.sheet .grp,.sheet .panel{background:var(--panel)}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line2);margin:8px auto 4px}
.sh-h{display:flex;align-items:center;gap:8px;padding:2px 0 8px;margin-right:-12px}
.sh-h h3{margin:0;font-size:17px;font-weight:500;letter-spacing:-.01em;flex:1;min-width:0}
.para{margin:14px 0 0}.para .lbl{margin-bottom:4px}.para p{margin:0;font-size:13.5px;line-height:1.6;color:var(--fg2)}
@media (min-width:700px){.sheet{align-items:center}.sheet .body{border-radius:12px;max-height:86vh}}
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:80;transform:translateX(-50%) translateY(10px);max-width:calc(100% - 32px);
padding:10px 14px;border-radius:8px;background:var(--fg);color:var(--bg);font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
#toast.show{opacity:1;transform:translateX(-50%)}
#ptr{position:fixed;left:50%;top:calc(60px + env(safe-area-inset-top,0px));z-index:25;width:34px;height:34px;margin-left:-17px;border-radius:50%;background:var(--panel);
border:1px solid var(--line);display:grid;place-items:center;color:var(--acc);opacity:0;transform:translateY(-20px);pointer-events:none}
#ptr.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.md{max-width:68ch}
.md h1{font-size:20px;font-weight:400;letter-spacing:-.015em;margin:4px 0 10px}
.md h2{font-size:10.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--fg3);margin:20px 0 6px}
.md p,.md li{color:var(--fg2);font-size:14px;line-height:1.6}.md li{margin-left:18px}.md table{margin:8px 0}
.set{display:flex;align-items:center;gap:12px;padding:12px 16px;width:100%;text-align:left;font-size:13.5px;min-height:48px}
.set .grow small{display:block;font-size:12px;color:var(--fg3);margin-top:1px}

/* ---- wide screens: a labelled sidebar; sections become bordered panels; Desk and Chart get two columns ---- */
@media (min-width:1024px){
  .tabbar{top:0;right:auto;width:216px;display:flex;flex-direction:column;gap:2px;padding:calc(12px + env(safe-area-inset-top,0px)) 12px 16px;
    border-top:0;border-right:1px solid var(--line)}
  .tabbar .brand{display:flex;align-items:center;gap:10px;height:40px;padding:0 8px;margin-bottom:12px;font-size:15px;font-weight:500;letter-spacing:-.01em}
  .tabbar .brand svg{width:26px;height:26px}.tabbar .brand span{color:var(--fg3)}
  .tabbar button{height:40px;flex-direction:row;justify-content:flex-start;gap:10px;padding:0 10px;border-radius:6px;font-size:13px;color:var(--fg2)}
  .tabbar button svg.i{width:18px;height:18px}
  .tabbar button[aria-selected="true"]{background:var(--raise);color:var(--fg)}
  .tabbar button[aria-selected="true"]::before{display:none}
  .bar,main{margin-left:216px}.bar{padding-left:24px}.bar h1 .logo{display:none}
  main{max-width:none;padding:16px 24px 48px}

  .grp,.panel{margin:0 0 16px;border:1px solid var(--line);border-radius:8px;overflow:hidden}

  .grp>.sec-h:first-child+.panel{border-top:1px solid var(--line)}
  .banner{margin:0 0 12px;border-radius:6px}
  .banner.net{border:1px dashed var(--line2)}
  .nowbar{margin:0 0 16px;border:1px solid var(--line);border-radius:8px}

  .subnav{margin:0 0 16px;padding:0;position:static}
  .wide-only{display:block!important}
  #toast{bottom:24px}
}
@media (min-width:1100px){
  .dgrid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:0 16px;align-items:start}
  .cgrid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:0 16px;align-items:start}

  .chartbox{height:clamp(420px,58vh,640px)}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

<script>
function qdAnswer(D, url) {
  const reply = (obj, status) => new Response(JSON.stringify(obj), { status: status || 200, headers: { "Content-Type": "application/json" } });
  const u = new URL(String(url), "https://snapshot.local/");
  const q = Object.fromEntries(u.searchParams.entries());
  switch (u.pathname) {
    case "/api/i/accounts": return reply([{ id: "snapshot", label: D.short || "Snapshot" }]);
    case "/api/i/state": {
      const ts = D.state.heartbeat && D.state.heartbeat.ts;
      // a published desk ages in real time (no heartbeat yet = offline); a frozen snapshot never goes stale
      // Safari rejects a space separator and more than 3 fractional digits: normalise before parsing
      const t = ts ? Date.parse(String(ts).trim().replace(" ", "T").replace(/(\.\d{3})\d+/, "$1")) : NaN;
      const age = !D.live ? 0 : isFinite(t) ? Math.max(0, (Date.now() - t) / 1000) : null;
      return reply(Object.assign({}, D.state, { age_sec: age }));
    }
    case "/api/i/thoughts": {
      const rows = D.thoughts.filter((t) => (!q.symbol || t.symbol === q.symbol) && (!q.before || t.id < Number(q.before)));
      return reply(rows.slice(0, Number(q.n || 40)));
    }
    case "/api/i/trades": return reply(D.trades.slice(0, Number(q.n || 100)));
    case "/api/i/trade": return D.trade[q.id] ? reply(D.trade[q.id]) : reply({ error: "trade details not in this snapshot" }, 404);
    case "/api/i/reviews": return reply(Object.keys(D.reviews).sort().reverse());
    case "/api/i/review": return D.reviews[q.date] ? reply({ date: q.date, markdown: D.reviews[q.date] }) : reply({ error: "no such review" }, 404);
    case "/api/i/stats": return reply(D.stats);
    case "/api/i/news": return reply((D.news || []).slice(0, Number(q.n || 120)));
    case "/api/i/chart": return reply(D.chart[(q.symbol || "NIFTY") + "|" + (q.interval || "1m")] || { bars: null });
    case "/api/config": return reply({ gocharting: { enabled: false } });
    default: return reply({ error: "not available on a read-only site" }, 404);
  }
}

window.QD_DEMO = true;
window.QD_PUBLISHED = true;
(function () {
  const realFetch = window.fetch.bind(window);
  let D = null, at = 0, pending = null;
  function load() {
    if (pending) return pending;
    if (D && Date.now() - at < 60000) return Promise.resolve(D);
    // no-cache = revalidate with the server (ETag), so an unchanged file costs a 304, not a download
    pending = realFetch("data.json", { cache: "no-cache" })
      .then((r) => { window.QD_OFFLINE_CACHE = r.headers.get("X-QD-Offline-Cache") === "1"; if (!r.ok) throw new Error("data.json: HTTP " + r.status); return r.json(); })
      .then((d) => { D = d; at = Date.now(); return D; })
      .catch((e) => { window.QD_OFFLINE_CACHE = true; if (!D) throw e; return D; })
      .finally(() => { pending = null; });
    return pending;
  }
  window.fetch = async (url) => qdAnswer(await load(), url);
  window.qdReload = () => { at = 0; return load(); };        // pull-to-refresh: skip the 60 s cache
})();
</script>
